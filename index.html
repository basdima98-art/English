<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Зошит — вивчення слів</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#1B2430;
    --ink-2:#232E3C;
    --paper:#F6F0E4;
    --paper-2:#ECE3CF;
    --cream-text:#EDE6D6;
    --dark-text:#2A2118;
    --sage:#4C7A5E;
    --sage-dark:#3B5F49;
    --rust:#C4622D;
    --slate:#96A0B0;
    --line: rgba(237,230,214,0.14);
    --radius-card: 10px;
    --radius-ui: 6px;
  }
  body[data-theme="light"]{
    --ink:#EDEAE2;
    --ink-2:#E2DDCE;
    --cream-text:#2A2118;
    --slate:#7C7362;
    --line: rgba(42,33,24,0.14);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--ink);
    color:var(--cream-text);
    font-family:'IBM Plex Sans', sans-serif;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    padding:22px 20px 14px;
  }
  .topbar-left{ display:flex; align-items:center; gap:10px; }
  .theme-toggle{
    background:none;
    border:1px solid var(--line);
    color:var(--cream-text);
    border-radius:20px;
    padding:6px 11px;
    font-size:14px;
    cursor:pointer;
    flex-shrink:0;
  }
  .topbar h1{
    font-family:'IBM Plex Serif', serif;
    font-weight:600;
    font-size:22px;
    margin:0;
    letter-spacing:0.2px;
  }
  .back-btn{
    background:none;
    border:none;
    color:var(--cream-text);
    font-size:20px;
    cursor:pointer;
    padding:4px 8px 4px 0;
    line-height:1;
    opacity:0.85;
  }
  .subtitle{
    color:var(--slate);
    font-size:13px;
    margin:2px 0 0;
  }
  main{
    flex:1;
    padding:4px 20px 100px;
    overflow-y:auto;
  }
  .pack-item{
    background:var(--paper);
    color:var(--dark-text);
    border-radius:var(--radius-card);
    padding:16px 18px;
    margin-bottom:12px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 0 rgba(0,0,0,0.18);
  }
  .pack-item .name{
    font-family:'IBM Plex Serif', serif;
    font-weight:600;
    font-size:17px;
  }
  .pack-item .meta{
    color:#6b6152;
    font-size:12.5px;
    margin-top:3px;
  }
  .pack-item .due-badge{
    background:var(--sage);
    color:var(--cream-text);
    font-size:12px;
    font-weight:500;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .empty-state{
    color:var(--slate);
    font-size:14px;
    line-height:1.6;
    padding:40px 4px;
    text-align:left;
  }
  .primary-btn{
    width:100%;
    background:var(--sage);
    color:var(--cream-text);
    border:none;
    border-radius:var(--radius-ui);
    padding:15px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    margin-top:8px;
  }
  .primary-btn:active{ background:var(--sage-dark); }
  .primary-btn:disabled{ opacity:0.45; cursor:default; }
  .secondary-btn{
    width:100%;
    background:transparent;
    color:var(--cream-text);
    border:1px solid var(--line);
    border-radius:var(--radius-ui);
    padding:14px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    cursor:pointer;
    margin-top:10px;
  }
  textarea, input[type=text]{
    width:100%;
    background:var(--paper);
    color:var(--dark-text);
    border:none;
    border-radius:var(--radius-ui);
    padding:14px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    resize:vertical;
  }
  textarea{ min-height:140px; }
  label.field-label{
    display:block;
    font-size:13px;
    color:var(--slate);
    margin:18px 0 8px;
  }
  .tense-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:6px;
  }
  .chip{
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    font-size:13.5px;
    color:var(--cream-text);
    cursor:pointer;
    user-select:none;
  }
  .chip.active{
    background:var(--sage);
    border-color:var(--sage);
  }
  .mode-list{ display:flex; flex-direction:column; gap:12px; margin-top:10px; }
  .mode-item{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:18px;
    cursor:pointer;
  }
  .mode-item .title{ font-family:'IBM Plex Serif', serif; font-size:16px; font-weight:600; }
  .mode-item .desc{ color:var(--slate); font-size:13px; margin-top:4px; }

  /* Flashcard screen */
  .card-stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:20px;
  }
  .progress-line{ color:var(--slate); font-size:13px; margin-bottom:22px; }
  .flashcard{
    width:100%;
    max-width:320px;
    height:210px;
    background:var(--paper);
    color:var(--dark-text);
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    box-shadow:0 6px 0 rgba(0,0,0,0.22);
    cursor:pointer;
    position:relative;
    touch-action:pan-y;
    user-select:none;
    will-change:transform;
  }
  .flashcard .word{
    font-family:'IBM Plex Serif', serif;
    font-size:28px;
    font-weight:700;
  }
  .word-wrap{ display:flex; flex-direction:column; align-items:center; }
  .transcription{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12.5px;
    color:#6b6152;
    opacity:0.6;
    margin-top:4px;
  }
  .speak-btn{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(42,33,24,0.08);
    border:none;
    border-radius:50%;
    width:34px;
    height:34px;
    font-size:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--dark-text);
  }
  .flashcard .translation{
    font-family:'IBM Plex Serif', serif;
    font-size:22px;
    font-weight:600;
  }
  .flashcard .example{
    font-size:14px;
    color:#6b6152;
    margin-top:10px;
    font-style:italic;
  }
  .flip-hint{ color:var(--slate); font-size:12.5px; margin-top:16px; }
  .direction-toggle{
    background:none;
    border:1px solid var(--line);
    color:var(--cream-text);
    border-radius:20px;
    padding:6px 14px;
    font-size:13px;
    cursor:pointer;
    margin-bottom:16px;
  }
  .swipe-label{
    position:absolute;
    top:14px;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:13px;
    padding:5px 12px;
    border-radius:20px;
    border:2px solid currentColor;
    opacity:0;
    pointer-events:none;
  }
  .swipe-label.know{ right:14px; color:var(--sage); transform:rotate(8deg); }
  .swipe-label.forgot{ left:14px; color:var(--rust); transform:rotate(-8deg); }
  .grade-row{ display:flex; gap:12px; width:100%; max-width:320px; margin-top:24px; }
  .grade-btn{
    flex:1;
    border:none;
    border-radius:var(--radius-ui);
    padding:14px 8px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
  }
  .grade-hard{ background:rgba(196,98,45,0.22); color:#E9A57C; }
  .grade-easy{ background:rgba(76,122,94,0.3); color:#9CC7AC; }
  .done-msg{ text-align:center; color:var(--slate); padding:60px 10px; font-size:14.5px; line-height:1.7; }

  /* Match */
  .match-cols{ display:flex; gap:10px; margin-top:10px; }
  .match-col{ flex:1; display:flex; flex-direction:column; gap:8px; }
  .match-tile{
    background:var(--paper);
    color:var(--dark-text);
    border-radius:var(--radius-ui);
    padding:12px 10px;
    font-size:14px;
    text-align:center;
    cursor:pointer;
    border:2px solid transparent;
  }
  .match-tile.selected{ border-color:var(--rust); }
  .match-tile.matched{ background:var(--sage); color:var(--cream-text); opacity:0.55; cursor:default; }
  .match-tile.wrong{ border-color:#c0392b; }

  /* Sentence exercise */
  .prompt-box{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:18px;
    margin:16px 0 20px;
  }
  .prompt-box .ukr{
    font-family:'IBM Plex Serif', serif;
    font-size:19px;
    line-height:1.5;
  }
  .feedback-box{
    border-radius:var(--radius-card);
    padding:16px;
    margin-top:16px;
    font-size:14px;
    line-height:1.6;
  }
  .feedback-box.correct{ background:rgba(76,122,94,0.25); }
  .feedback-box.incorrect{ background:rgba(196,98,45,0.2); }
  .loading{ color:var(--slate); font-size:14px; text-align:center; padding:30px 0; }

  /* Bottom nav */
  .bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:460px;
    display:flex;
    background:var(--ink-2);
    border-top:1px solid var(--line);
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    flex:1;
    background:none;
    border:none;
    color:var(--slate);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:11px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    cursor:pointer;
    padding:4px 0;
  }
  .nav-btn.active{ color:var(--cream-text); }
  .nav-icon{ font-size:19px; }
  .stat-row{
    display:flex;
    justify-content:space-between;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:16px 18px;
    margin-bottom:12px;
  }
  .stat-num{ font-family:'IBM Plex Serif', serif; font-size:24px; font-weight:700; }
  .stat-label{ color:var(--slate); font-size:12.5px; margin-top:2px; }

  .option-btn{
    width:100%;
    text-align:left;
    background:var(--paper);
    color:var(--dark-text);
    border:2px solid transparent;
    border-radius:var(--radius-ui);
    padding:14px 16px;
    font-size:15px;
    margin-bottom:10px;
    cursor:pointer;
  }
  .option-btn.correct{ border-color:var(--sage); }
  .option-btn.wrong{ border-color:var(--rust); }
  .option-btn:disabled{ opacity:0.9; cursor:default; }

  .word-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius-ui);
    padding:12px 14px;
    margin-bottom:8px;
  }
  .word-row .w{ font-weight:500; }
  .word-row .t{ color:var(--slate); font-size:13px; margin-top:2px; }
  .del-x{
    background:none;
    border:none;
    color:var(--rust);
    font-size:20px;
    cursor:pointer;
    padding:2px 8px;
    flex-shrink:0;
  }
  .danger-btn{
    width:100%;
    background:transparent;
    color:var(--rust);
    border:1px solid rgba(196,98,45,0.4);
    border-radius:var(--radius-ui);
    padding:14px;
    font-size:14.5px;
    cursor:pointer;
    margin-top:24px;
  }
  .replay-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--cream-text);
    border-radius:20px;
    padding:10px 18px;
    font-size:14px;
    cursor:pointer;
    margin-bottom:18px;
  }
  .account-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:14px 16px;
    margin-bottom:16px;
  }
  .account-row .email{ font-size:13.5px; color:var(--cream-text); }
  .google-btn{
    width:100%;
    background:var(--paper);
    color:var(--dark-text);
    border:none;
    border-radius:var(--radius-ui);
    padding:14px;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    margin-bottom:16px;
  }
  .signout-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--rust);
    border-radius:20px;
    padding:6px 14px;
    font-size:13px;
    cursor:pointer;
  }
  .chat-list{ display:flex; flex-direction:column; gap:10px; }
  .bubble{
    max-width:82%;
    padding:12px 14px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.55;
    white-space:pre-wrap;
  }
  .bubble.user{
    align-self:flex-end;
    background:var(--sage);
    color:var(--cream-text);
    border-bottom-right-radius:4px;
  }
  .bubble.assistant{
    align-self:flex-start;
    background:var(--paper);
    color:var(--dark-text);
    border-bottom-left-radius:4px;
  }
  .chat-empty{ color:var(--slate); font-size:14px; padding:30px 4px; line-height:1.6; }
  .chat-input-bar{
    position:fixed;
    bottom:70px;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:460px;
    background:var(--ink);
    border-top:1px solid var(--line);
    padding:10px 20px;
    display:flex;
    gap:8px;
  }
  .chat-input-bar input{ flex:1; }
  .chat-send-btn{
    background:var(--sage);
    color:var(--cream-text);
    border:none;
    border-radius:var(--radius-ui);
    padding:0 18px;
    font-size:14px;
    cursor:pointer;
  }
  .pack-mode-toggle{ display:flex; gap:8px; margin-bottom:14px; }
  .pack-mode-toggle .chip{ flex:1; text-align:center; }
  select.pack-select{
    width:100%;
    background:var(--paper);
    color:var(--dark-text);
    border:none;
    border-radius:var(--radius-ui);
    padding:14px;
    font-size:15px;
  }
  .ref-row{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius-ui);
    padding:14px 16px;
    margin-bottom:8px;
  }
  .ref-row .head{ display:flex; justify-content:space-between; font-weight:600; font-family:'IBM Plex Serif',serif; font-size:15.5px; }
  .ref-row .meta{ color:var(--slate); font-size:13px; margin-top:4px; }
  .ref-row .ex{ color:var(--slate); font-size:13px; margin-top:4px; font-style:italic; }
  .range-row{ display:flex; align-items:center; gap:10px; margin:6px 0 4px; }
  .range-row input[type=range]{ flex:1; }
  .range-value{ font-family:'IBM Plex Serif',serif; font-weight:600; min-width:64px; text-align:right; }
  .search-input{
    width:100%;
    background:var(--paper);
    color:var(--dark-text);
    border:none;
    border-radius:var(--radius-ui);
    padding:13px 14px;
    font-size:15px;
    margin-bottom:12px;
  }
  .pack-check-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius-ui);
    padding:12px 14px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .pack-check-row .box{
    width:20px; height:20px; border-radius:5px; border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:13px;
  }
  .pack-check-row.checked .box{ background:var(--sage); border-color:var(--sage); color:var(--cream-text); }
  .ws-words{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:4px; }
  .ws-word-chip{
    padding:6px 13px;
    border-radius:16px;
    border:1px solid var(--line);
    font-size:12.5px;
    color:var(--cream-text);
    font-family:'IBM Plex Sans',sans-serif;
  }
  .ws-word-chip.found{ text-decoration:line-through; opacity:0.55; background:var(--sage); border-color:var(--sage); }
  .ws-grid{
    display:grid;
    gap:3px;
    background:var(--paper-2);
    border-radius:var(--radius-card);
    padding:8px;
    margin:16px 0;
    touch-action:none;
    user-select:none;
    box-shadow:0 4px 0 rgba(0,0,0,0.18);
  }
  .ws-cell{
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--paper);
    color:var(--dark-text);
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:600;
    font-size:clamp(9px,3.4vw,15px);
    border-radius:4px;
  }
  .ws-cell.selected{ background:var(--rust); color:var(--cream-text); }
  .ws-cell.found{ background:var(--sage); color:var(--cream-text); }

  .hm-lives{ text-align:center; font-size:18px; letter-spacing:3px; margin-bottom:12px; }
  .hm-word{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin:18px 0; }
  .hm-letter{ width:30px; height:38px; border-bottom:3px solid var(--slate); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Serif',serif; font-size:22px; }
  .hm-letter.revealed-miss{ color:var(--rust); }
  .kb-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin:10px 0; }
  .kb-key{ padding:10px 0; border-radius:8px; border:1px solid var(--line); background:var(--card, transparent); color:inherit; font-family:'IBM Plex Sans',sans-serif; font-size:15px; cursor:pointer; }
  .kb-key.hit{ background:rgba(76,122,94,0.35); border-color:var(--sage); }
  .kb-key.miss{ opacity:0.35; }
  .kb-key:disabled{ cursor:default; }
  .sb-line{ min-height:60px; border:1.5px dashed var(--line); border-radius:12px; padding:10px; display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .sb-bank{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .sb-tok{ padding:9px 13px; border-radius:10px; border:1px solid var(--line); background:var(--card, transparent); color:inherit; font-family:'IBM Plex Sans',sans-serif; font-size:15px; cursor:pointer; }
  .sb-tok.in-line{ border-color:var(--sage); }
  .sm-hud{ display:flex; justify-content:space-between; font-size:18px; font-weight:600; margin-bottom:14px; }
  .sm-timer.low{ color:var(--rust); }

  .lesson-h{ font-family:'IBM Plex Serif',serif; font-weight:600; font-size:16px; margin:20px 0 8px; }
  .lesson-p{ font-size:14.5px; line-height:1.6; margin-bottom:6px; }
  .lesson-list{ margin:0 0 6px; padding-left:20px; font-size:14.5px; line-height:1.6; }
  .lesson-list li{ margin-bottom:6px; }
  .lesson-ex{ position:relative; border-left:3px solid var(--sage); padding:6px 44px 6px 12px; margin:8px 0; }
  .lesson-ex .en{ font-weight:600; font-size:14.5px; }
  .lesson-ex .ua{ color:var(--slate); font-size:13px; margin-top:2px; }
  .lesson-speak{ position:absolute; right:4px; top:6px; background:none; border:none; font-size:18px; cursor:pointer; }
  .section-label{ color:var(--slate); font-size:12.5px; text-transform:uppercase; letter-spacing:0.06em; margin:18px 0 8px; }
</style>
</head>

let auth = null, db = null;
try{
  if (typeof firebase !== 'undefined' && firebaseConfig.apiKey !== "ТВІЙ_apiKey"){
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
  }
}catch(e){ console.error('Firebase init failed', e); window.__fbInitError = (e && e.message) ? e.message : String(e); }

function signInWithGoogle(){
  if (!auth) return;
  const provider = new firebase.auth.GoogleAuthProvider();
  const fail = e => {
    console.error(e);
    window.__fbAuthError = ((e && e.code) ? e.code + ': ' : '') + ((e && e.message) ? e.message : String(e));
    render();
  };
  const ua = navigator.userAgent;
  // redirect лишаємо тільки для Safari на iOS (там він працює); в Chrome/Firefox на телефоні й комп'ютері — popup
  const isIosSafari = /iPhone|iPad|iPod/i.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua);
  const isMobile = isIosSafari;
  window.__fbAuthError = null;
  if (isMobile){
    auth.signInWithRedirect(provider).catch(fail);
  } else {
    // на комп'ютері popup працює надійніше (Chrome/Firefox блокують сторонні cookies для redirect)
    auth.signInWithPopup(provider).catch(e => {
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')){
        auth.signInWithRedirect(provider).catch(fail);
      } else if (e && (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request')){
        // користувач сам закрив вікно
      } else fail(e);
    });
  }
}
function signOutUser(){
  if (!auth) return;
  auth.signOut();
}

const WS_DIR_VECTORS = {
  right:[0,1], left:[0,-1], down:[1,0], up:[-1,0],
  downright:[1,1], downleft:[1,-1], upright:[-1,1], upleft:[-1,-1]
};

function pickWordsForSearch(packIds, count, maxLen){
  const eligible = {};
  packIds.forEach(pid => {
    const pack = state.packs.find(p => p.id === pid);
    if (!pack) return;
    eligible[pid] = pack.words
      .filter(w => /^[A-Za-z]+$/.test(w.word) && w.word.length >= 3 && w.word.length <= maxLen)
      .map(w => w.word)
      .sort(() => Math.random() - 0.5);
  });
  const n = packIds.length;
  if (!n) return [];
  const per = Math.floor(count / n);
  const taken = {};
  const result = [];
  packIds.forEach(pid => {
    const list = eligible[pid] || [];
    const take = list.slice(0, per);
    taken[pid] = take.length;
    result.push(...take);
  });
  let remaining = count - result.length;
  if (remaining > 0){
    const leftover = [];
    packIds.forEach(pid => { leftover.push(...(eligible[pid] || []).slice(taken[pid] || 0)); });
    leftover.sort(() => Math.random() - 0.5);
    result.push(...leftover.slice(0, remaining));
  }
  const unique = [...new Set(result.map(w => w.toUpperCase()))];
  return unique.sort(() => Math.random() - 0.5).slice(0, count);
}

function generateWordSearch(words, size, directions){
  const grid = Array.from({ length:size }, () => Array(size).fill(null));
  const placed = [];
  const sorted = [...words].sort((a,b) => b.length - a.length);
  sorted.forEach(word => {
    const w = word.toUpperCase();
    const len = w.length;
    let success = false;
    for (let attempt = 0; attempt < 200 && !success; attempt++){
      const dirKey = directions[Math.floor(Math.random() * directions.length)];
      const [dr, dc] = WS_DIR_VECTORS[dirKey];
      const rEnd = dr * (len - 1);
      const cEnd = dc * (len - 1);
      const rLow = rEnd < 0 ? -rEnd : 0;
      const rHigh = rEnd < 0 ? size - 1 : size - 1 - rEnd;
      const cLow = cEnd < 0 ? -cEnd : 0;
      const cHigh = cEnd < 0 ? size - 1 : size - 1 - cEnd;
      if (rHigh < rLow || cHigh < cLow) continue;
      const r0 = rLow + Math.floor(Math.random() * (rHigh - rLow + 1));
      const c0 = cLow + Math.floor(Math.random() * (cHigh - cLow + 1));
      let fits = true;
      const path = [];
      for (let i = 0; i < len; i++){
        const r = r0 + dr * i, c = c0 + dc * i;
        const existing = grid[r][c];
        if (existing && existing !== w[i]){ fits = false; break; }
        path.push({ r, c });
      }
      if (!fits) continue;
      path.forEach((p, i) => { grid[p.r][p.c] = w[i]; });
      placed.push({ word:w, path, pathKey: path.map(p => p.r+','+p.c).join('|'), found:false });
      success = true;
    }
  });
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for (let r=0; r<size; r++) for (let c=0; c<size; c++) if (!grid[r][c]) grid[r][c] = letters[Math.floor(Math.random()*letters.length)];
  return { grid, placed };
}

function wsComputePath(r0, c0, r1, c1){
  const dr = r1 - r0, dc = c1 - c0;
  if (dr === 0 && dc === 0) return [{ r:r0, c:c0 }];
  if (!(dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc))) return [{ r:r0, c:c0 }];
  const stepR = dr === 0 ? 0 : dr / Math.abs(dr);
  const stepC = dc === 0 ? 0 : dc / Math.abs(dc);
  const len = Math.max(Math.abs(dr), Math.abs(dc));
  const path = [];
  for (let i=0; i<=len; i++) path.push({ r:r0+stepR*i, c:c0+stepC*i });
  return path;
}

async function storeGet(key){
  try{
    if (state.user && db){
      const doc = await db.collection('users').doc(state.user.uid).collection('data').doc(key).get();
      return doc.exists ? doc.data().value : null;
    }
    if (window.storage && typeof window.storage.get === 'function'){
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : null;
    }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    if (state.user && db) throw e;
    return null;
  }
}
async function storeSet(key, value){
  try{
    if (state.user && db && state.dataError) return; // не затирати хмарні дані, якщо їх не вдалось завантажити
    if (state.user && db){
      await db.collection('users').doc(state.user.uid).collection('data').doc(key).set({ value });
      return;
    }
    if (window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(key, JSON.stringify(value), false);
    } else {
      localStorage.setItem(key, JSON.stringify(value));
    }
  }catch(e){ console.error('storage error', e); }
}

async function loadAllData(){
  state.dataError = null;
  try{ await loadAllDataInner(); }
  catch(e){
    console.error('load error', e);
    state.dataError = ((e && e.code) ? e.code + ': ' : '') + ((e && e.message) ? e.message : String(e));
    state.packs = []; state.activityLog = []; state.chatMessages = []; state.verbProgress = {};

  }
}
async function loadAllDataInner(){
  const packs = await storeGet('packs');
  const tenses = await storeGet('coveredTenses');
  const theme = await storeGet('theme');
  const chat = await storeGet('chatMessages');
  const level = await storeGet('level');
  const activityLog = await storeGet('activityLog');
  const verbProgress = await storeGet('verbProgress');
  const cardDirection = await storeGet('cardDirection');
  const sentenceBatch = await storeGet('sentenceBatch');
  state.packs = (packs && packs.length) ? packs : (state.user ? [] : [seedDemoPack()]);
  if ((!packs || !packs.length) && !state.user) await storeSet('packs', state.packs);
  state.coveredTenses = tenses || ["Present Simple","Present Perfect"];

  state.level = level || 'A2';
  state.chatMessages = chat || [];
  state.activityLog = activityLog || [];
  state.verbProgress = verbProgress || {};
  state.cardDirection = cardDirection || 'en';
  state.sentenceBatchSize = (sentenceBatch === 5 || sentenceBatch === 10) ? sentenceBatch : 10;
  document.body.setAttribute('data-theme', state.theme);
}

async function callClaudeAPI(body){
  try{
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('direct call unavailable');
    return await res.json();
  }catch(e){
    const res2 = await fetch("/api/claude", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    return await res2.json();
  }
}

async function askClaude(userPrompt, systemPrompt, maxTokens, model){
  const body = {
    model: model || "claude-haiku-4-5-20251001",
    max_tokens: maxTokens || 1000,
    messages: [{ role: "user", content: userPrompt }]
  };
  if (systemPrompt) body.system = systemPrompt;
  const data = await callClaudeAPI(body);
  const block = (data.content || []).find(b => b.type === "text");
  return block ? block.text : "";
}

async function askClaudeConversation(messages, systemPrompt){
  const body = {
    model: "claude-haiku-4-5-20251001",
    max_tokens: 1000,
    messages: messages.map(m => ({ role: m.role, content: m.content }))
  };
  if (systemPrompt) body.system = systemPrompt;
  const data = await callClaudeAPI(body);
  const block = (data.content || []).find(b => b.type === "text");
  return block ? block.text : "";
}

function parseJSONLoose(text){
  const cleaned = text.replace(/```json/g,'').replace(/```/g,'').trim();
  return JSON.parse(cleaned);
}

function goto(route, extra){
  state.route = route;
  Object.assign(state, extra || {});
  render();
}

// ---------- Card generation ----------
async function generateCards(packNameOrTargetId, rawText, appendToExisting){
  const system = "Ти генеруєш навчальні картки англійської мови для україномовного користувача рівня A2-B1. Завжди повертай ЛИШЕ валідний JSON, без пояснень і без markdown-огорожі.";
  const prompt = `Ось текст або список слів для вивчення:\n\n${rawText}\n\nСтвори JSON-масив об'єктів формату {"word":"...", "translation":"...", "example":"...", "transcription":"..."} для ВСІХ значущих слів чи фраз звідси (пропускай артиклі, займенники, прийменники, якщо це суцільний текст). "transcription" — якщо у вихідному тексті вже є транскрипція (IPA чи вимова кирилицею) — візьми її; якщо немає — згенеруй стандартну IPA-транскрипцію сам. "example" — просте речення англійською з цим словом. Обробляй увесь наданий текст, не обмежуй кількість об'єктів. Поверни лише масив.`;
  const raw = await askClaude(prompt, system, 4000);
  const items = parseJSONLoose(raw);
  const words = items.map(it => ({
    id: uid(),
    word: it.word,
    translation: it.translation,
    example: it.example || "",
    transcription: it.transcription || "",
    box: 1,
    dueAt: Date.now()
  }));
  if (appendToExisting){
    const pack = state.packs.find(p => p.id === packNameOrTargetId);
    pack.words.push(...words);
    await savePacks();
    return pack;
  }
  const pack = { id: uid(), name: packNameOrTargetId, words };
  state.packs.push(pack);
  await savePacks();
  return pack;
}

function speakText(text){
  if (!text || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  window.speechSynthesis.speak(utter);
}

function dueWords(pack){
  const now = Date.now();
  const shuffled = [...pack.words].sort(() => Math.random() - 0.5);
  const due = shuffled.filter(w => w.dueAt <= now).sort((a,b)=>a.box-b.box);
  return due.length ? due : shuffled.sort((a,b)=>a.box-b.box);
}

async function logEvent(kind, correct, meta){
  try{
    const log = state.activityLog || (state.activityLog = []);
    log.push({ ts: Date.now(), kind, correct: !!correct, meta: meta || '' });
    if (log.length > 400) log.splice(0, log.length - 400);
    await storeSet('activityLog', log);
  }catch(e){ /* logging is best-effort */ }
}

function gradeCard(pack, word, easy){
  if (easy){
    word.box = Math.min(5, word.box + 1);
  } else {
    word.box = 1;
  }
  word.dueAt = Date.now() + BOX_HOURS[word.box] * 3600 * 1000;
  logEvent('word', easy, pack ? pack.name : '');
}

function reinsertForRetry(item, wordId){
  if (!state.sessionRetried) state.sessionRetried = new Set();
  const id = wordId || item.id;
  if (state.sessionRetried.has(id)) return;
  state.sessionRetried.add(id);
  const remaining = state.sessionQueue.length - (state.sessionIndex + 1);
  if (remaining <= 0){
    state.sessionQueue.push(item);
    return;
  }
  const offset = 1 + Math.floor(Math.random() * remaining);
  state.sessionQueue.splice(state.sessionIndex + offset, 0, item);
}

    return wrap;

  state.packs.forEach(pack => {

    const due = dueWords(pack).length;

      <div>

        <div class="meta">${pack.words.length} карток</div>

function attachSwipeHandlers(card, pack, word){
  let startX = 0, dx = 0, dragging = false, moved = false;
  const knowLabel = card.querySelector('.swipe-label.know');
  const forgotLabel = card.querySelector('.swipe-label.forgot');
  const THRESHOLD = 90;

  card.onpointerdown = (e) => {
    dragging = true; moved = false; dx = 0;
    startX = e.clientX;
    card.style.transition = 'none';
    card.setPointerCapture(e.pointerId);
  };
  card.onpointermove = (e) => {
    if (!dragging) return;
    dx = e.clientX - startX;
    if (Math.abs(dx) > 5) moved = true;
    const rotate = dx / 18;
    card.style.transform = `translateX(${dx}px) rotate(${rotate}deg)`;
    const t = Math.min(Math.abs(dx) / THRESHOLD, 1);
    if (dx > 0){ knowLabel.style.opacity = t; forgotLabel.style.opacity = 0; }
    else if (dx < 0){ forgotLabel.style.opacity = t; knowLabel.style.opacity = 0; }
    else { knowLabel.style.opacity = 0; forgotLabel.style.opacity = 0; }
  };
  const finish = (e) => {
    if (!dragging) return;
    dragging = false;
    card.style.transition = 'transform 0.28s ease, opacity 0.28s ease';
    if (dx > THRESHOLD){
      card.style.transform = `translateX(700px) rotate(20deg)`;
      card.style.opacity = '0';
      gradeCard(pack, word, true);
      savePacks();
      setTimeout(nextCard, 220);
    } else if (dx < -THRESHOLD){
      card.style.transform = `translateX(-700px) rotate(-20deg)`;
      card.style.opacity = '0';
      gradeCard(pack, word, false);
      reinsertForRetry(word);
      savePacks();
      setTimeout(nextCard, 220);
    } else {
      card.style.transform = 'translateX(0) rotate(0)';
      knowLabel.style.opacity = 0;
      forgotLabel.style.opacity = 0;
      if (!moved){ state.flipped = true; render(); }
    }
    dx = 0;
  };
  card.onpointerup = finish;
  card.onpointercancel = finish;
}

function nextCard(){
  state.sessionIndex += 1;
  state.flipped = false;
  render();
}

// ---------- Match ----------
const MATCH_PAGE_SIZE = 10;

function startMatchSession(){
  const pack = currentPack();
  state.matchAllWords = [...pack.words].sort(() => Math.random() - 0.5);
  state.matchPageIndex = 0;
  loadMatchPage();
  goto('match');
}

function loadMatchPage(){
  const start = state.matchPageIndex * MATCH_PAGE_SIZE;
  const pageWords = state.matchAllWords.slice(start, start + MATCH_PAGE_SIZE);
  const left = pageWords.map(w => ({ id:w.id, text:w.word })).sort(() => Math.random() - 0.5);
  const right = pageWords.map(w => ({ id:w.id, text:w.translation })).sort(() => Math.random() - 0.5);
  state.matchState = { left, right, selectedLeft:null, selectedRight:null, matched:[], wrong:null };
}

function renderMatch(){
  const wrap = document.createElement('div');
  const ms = state.matchState;
  const total = state.matchAllWords.length;
  const pageStart = state.matchPageIndex * MATCH_PAGE_SIZE + 1;
  const pageEnd = Math.min((state.matchPageIndex + 1) * MATCH_PAGE_SIZE, total);
  const progress = document.createElement('div');
  progress.className = 'progress-line';
  progress.textContent = `${pageStart}–${pageEnd} з ${total}`;
  wrap.appendChild(progress);

  const cols = document.createElement('div');
  cols.className = 'match-cols';
  const colL = document.createElement('div'); colL.className = 'match-col';
  const colR = document.createElement('div'); colR.className = 'match-col';

  ms.left.forEach(item => {
    const tile = document.createElement('div');
    tile.className = 'match-tile';
    if (ms.matched.includes(item.id)) tile.classList.add('matched');
    if (ms.selectedLeft === item.id) tile.classList.add('selected');
    if (ms.wrong === item.id) tile.classList.add('wrong');
    tile.textContent = item.text;
    tile.onclick = () => { if (!ms.matched.includes(item.id)){ ms.selectedLeft = item.id; checkMatch(); render(); } };
    colL.appendChild(tile);
  });
  ms.right.forEach(item => {
    const tile = document.createElement('div');
    tile.className = 'match-tile';
    if (ms.matched.includes(item.id)) tile.classList.add('matched');
    if (ms.selectedRight === item.id) tile.classList.add('selected');
    tile.textContent = item.text;
    tile.onclick = () => { if (!ms.matched.includes(item.id)){ ms.selectedRight = item.id; checkMatch(); render(); } };
    colR.appendChild(tile);
  });
  cols.appendChild(colL); cols.appendChild(colR);
  wrap.appendChild(cols);

  if (ms.matched.length === ms.left.length){
    const hasMore = pageEnd < total;
    const done = document.createElement('div');
    done.className = 'done-msg';
    done.textContent = hasMore ? 'Ці 10 пройдено 🎉' : `Усі ${total} слів пройдено 🎉`;
    wrap.appendChild(done);
    const nextBtn = document.createElement('button');
    nextBtn.className = 'primary-btn';
    if (hasMore){
      nextBtn.textContent = 'Наступні 10 слів';
      nextBtn.onclick = () => { state.matchPageIndex++; loadMatchPage(); render(); };
    } else {
      nextBtn.textContent = 'Почати спочатку';
      nextBtn.onclick = () => startMatchSession();
    }
    wrap.appendChild(nextBtn);
  }
  return wrap;
}

function checkMatch(){
  const ms = state.matchState;
  if (ms.selectedLeft && ms.selectedRight){
    if (ms.selectedLeft === ms.selectedRight){
      ms.matched.push(ms.selectedLeft);
      ms.selectedLeft = null; ms.selectedRight = null; ms.wrong = null;
    } else {
      ms.wrong = ms.selectedLeft;
      const badLeft = ms.selectedLeft, badRight = ms.selectedRight;
      setTimeout(() => {
        ms.selectedLeft = null; ms.selectedRight = null; ms.wrong = null;
        render();
      }, 600);
    }
  }
}

function buildGapSentence(word){
  if (!word.example) return null;
  const re = new RegExp('\\b' + word.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\w*', 'i');
  if (!re.test(word.example)) return null;
  return word.example.replace(re, '____');
}

async function loadSentenceBatch(){
  const pack = currentPack();
  const tenses = state.coveredTenses.length ? state.coveredTenses : ["Present Simple"];
  const words = pack.words.map(w=>w.word);
  const level = state.level || 'A2';
  const harderLevel = nextLevelUp(level);
  const system = "Ти — викладач англійської для україномовного студента. Ти складаєш вправи на переклад речення з української на англійську.";
  const prompt = `Рівень студента: ${level}. Дозволені часові форми: ${tenses.join(", ")}.\nСлова з пакету: ${words.join(", ")}.\n\nСклади ${state.sentenceBatchSize} РІЗНИХ речень українською мовою, переклад яких англійською вимагає однієї з дозволених часових форм. Постарайся використати слова зі списку (різні слова в різних реченнях, у потрібній формі). Приблизно 60-70% речень має відповідати рівню ${level}, а 30-40% — навмисно трохи складніші, рівня ${harderLevel} (складніша лексика чи структура), щоб студент прогресував швидше.\n\nВАЖЛИВО: розподіли речення приблизно порівну між трьома формами — стверджувальні (affirmative), заперечні (negative) і питальні (question) — так, щоб студент практикував побудову всіх трьох форм у кожному часі. Сформулюй українське речення так, щоб було природно перекласти саме в потрібній формі (наприклад, для заперечення — "Я не..." / "Вона ще не...", для питання — прямо постав питання).\n\nПоверни ЛИШЕ JSON-масив з ${state.sentenceBatchSize} об'єктів формату {"ukrainian":"...", "expected_tense":"...", "target_word":"...", "form":"affirmative або negative або question", "level":"A2 або B1 тощо"} без пояснень.`;
  try{
    const raw = await askClaude(prompt, system, 3000, "claude-sonnet-4-6");
    const items = parseJSONLoose(raw);
    state.sentenceState = { loading:false, items, answers: items.map(()=>''), currentIndex:0, checking:false, results:null };
  }catch(e){
    state.sentenceState = { loading:false, items:[], answers:[], currentIndex:0, checking:false, results:'error' };
  }
  render();
}

async function checkSentenceBatch(){
  const ss = state.sentenceState;
  ss.checking = true;
  render();
  const system = "Ти перевіряєш переклади студента з української на англійську. Фокусуйся на граматичній правильності, правильній часовій формі та вживанні цільового слова кожного речення. Пояснюй доброзичливо і конкретно, з поясненням граматики там, де є помилка.";
  const payload = ss.items.map((it, i) => ({
    ukrainian: it.ukrainian,
    expected_tense: it.expected_tense,
    expected_form: it.form,
    target_word: it.target_word,
    student_answer: ss.answers[i]
  }));
  const prompt = `Ось ${payload.length} речень з відповідями студента у форматі JSON:\n${JSON.stringify(payload)}\n\nПеревір КОЖНЕ речення окремо — і часову форму, і структуру (affirmative/negative/question відповідно до expected_form). Поверни ЛИШЕ JSON-масив з ${payload.length} об'єктів у ТОМУ Ж ПОРЯДКУ, формату {"correct": true/false, "feedback":"розмовне пояснення українською чому правильно чи неправильно (враховуючи і час, і структуру)", "tense_note":"яку саме часову форму і яку структуру (стверджувальну/заперечну/питальну) треба застосувати в цьому реченні і чому саме їх (коротко, українською)", "corrected":"виправлений варіант, якщо є помилки, інакше порожній рядок"}.`;
  try{
    const raw = await askClaude(prompt, system, 3000, "claude-sonnet-4-6");
    ss.results = parseJSONLoose(raw);
    ss.results.forEach((r, i) => logEvent('sentence', r.correct, (ss.items[i] && ss.items[i].expected_tense) || ''));
  }catch(e){
    ss.results = 'error';
  }
  ss.checking = false;
  render();
}

function renderSentence(){
  const wrap = document.createElement('div');
  const ss = state.sentenceState;
  if (ss.loading){
    const l = document.createElement('div'); l.className='loading'; l.textContent='Готую ' + state.sentenceBatchSize + ' речень...';
    wrap.appendChild(l);
    return wrap;
  }
  if (!ss.items.length){
    const l = document.createElement('div'); l.className='loading'; l.textContent='Не вдалось згенерувати речення. Спробуй ще раз.';
    wrap.appendChild(l);
    return wrap;
  }

  // Results view after batch check
  if (ss.results && ss.results !== 'error'){
    const summary = document.createElement('div');
    summary.className = 'progress-line';
    const correctCount = ss.results.filter(r => r.correct).length;
    summary.textContent = `Правильно: ${correctCount} / ${ss.results.length}`;
    wrap.appendChild(summary);

    ss.items.forEach((it, i) => {
      const r = ss.results[i] || {};
      const box = document.createElement('div');
      box.className = 'prompt-box';
      let html = `<div class="ukr" style="font-size:15px;">${escapeHtml(it.ukrainian)}</div>`;
      html += `<div style="margin-top:8px;color:var(--slate);font-size:13px;">Твоя відповідь: ${escapeHtml(ss.answers[i] || '—')}</div>`;
      box.innerHTML = html;
      wrap.appendChild(box);
      const fb = document.createElement('div');
      fb.className = 'feedback-box ' + (r.correct ? 'correct' : 'incorrect');
      let fbHtml = `<div>${escapeHtml(r.feedback || '')}</div>`;
      if (r.tense_note){
        fbHtml += `<div style="margin-top:8px;"><strong>Часова форма:</strong> ${escapeHtml(r.tense_note)}</div>`;
      }
      if (r.corrected){
        fbHtml += `<div style="margin-top:8px;"><strong>Варіант:</strong> ${escapeHtml(r.corrected)}</div>`;
      }
      fb.innerHTML = fbHtml;
      wrap.appendChild(fb);
    });

    const next = document.createElement('button');
    next.className = 'primary-btn';
    next.textContent = 'Наступні ' + state.sentenceBatchSize + ' речень';
    next.onclick = () => startSentenceSession();
    wrap.appendChild(next);
    return wrap;
  }

  if (ss.results === 'error'){
    const l = document.createElement('div'); l.className='loading'; l.textContent='Не вдалось перевірити відповіді. Спробуй ще раз.';
    wrap.appendChild(l);
    const retry = document.createElement('button');
    retry.className = 'primary-btn';
    retry.textContent = 'Спробувати ще раз';
    retry.onclick = () => { ss.results = null; render(); };
    wrap.appendChild(retry);
    return wrap;
  }

  // Answering view: one sentence at a time, no grading yet
  const idx = ss.currentIndex;
  const item = ss.items[idx];
  const progress = document.createElement('div');
  progress.className = 'progress-line';
  progress.textContent = `${idx + 1} / ${ss.items.length}`;
  wrap.appendChild(progress);

  const formLabels = { affirmative:'Стверджувальне речення', negative:'Заперечне речення', question:'Питальне речення' };
  const formLabel = formLabels[item.form] || '';

  const box = document.createElement('div');
  box.className = 'prompt-box';
  box.innerHTML = (formLabel ? `<div class="chip active" style="display:inline-block;margin-bottom:10px;">${escapeHtml(formLabel)}</div>` : '') + `<div class="ukr">${escapeHtml(item.ukrainian)}</div>`;
  wrap.appendChild(box);

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Переклади англійською...';
  input.value = ss.answers[idx];
  input.oninput = (e) => { ss.answers[idx] = e.target.value; };
  wrap.appendChild(input);

  const btn = document.createElement('button');
  btn.className = 'primary-btn';
  const isLast = idx === ss.items.length - 1;
  btn.textContent = ss.checking ? 'Перевіряю всі...' : (isLast ? 'Перевірити всі 10' : 'Далі');
  btn.disabled = ss.checking;
  btn.onclick = () => {
    if (isLast){
      checkSentenceBatch();
    } else {
      ss.currentIndex++;
      render();
    }
  };
  wrap.appendChild(btn);
  return wrap;
}

async function sendChatMessage(){
  const text = state.chatInput.trim();
  if (!text || state.chatLoading) return;
  state.chatMessages.push({ role:'user', content:text });
  state.chatInput = '';
  state.chatLoading = true;
  render();
  const system = "Ти — дружній репетитор англійської мови для україномовного студента рівня A2, який спілкується українською мовою. Пояснюй граматику, виправляй помилки, наводь приклади речень. Відповідай природно й розмовно, як у звичайній розмові, без зайвого форматування.";
  try{
    const reply = await askClaudeConversation(state.chatMessages, system);
    state.chatMessages.push({ role:'assistant', content: reply || 'Вибач, не вдалось отримати відповідь.' });
  }catch(e){
    state.chatMessages.push({ role:'assistant', content:'Сталася помилка запиту. Спробуй ще раз.' });
  }
  state.chatLoading = false;
  await storeSet('chatMessages', state.chatMessages);
  render();
}

    retry.onclick = () => startGrammarQuiz(qs.topic, state.grammarQuizBack);

  }
  const q = qs.questions[qs.index];
  const progress = document.createElement('div');
  progress.className = 'progress-line';
  progress.textContent = `${qs.index + 1} / ${qs.questions.length}`;
  wrap.appendChild(progress);
  const box = document.createElement('div');
  box.className = 'prompt-box';
  box.innerHTML = `<div class="ukr" style="font-size:17px;">${escapeHtml(q.prompt)}</div>`;
  wrap.appendChild(box);
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    if (qs.answered){
      if (opt === q.correct) btn.classList.add('correct');
      else if (opt === qs.answered.chosen) btn.classList.add('wrong');
    }
    btn.disabled = !!qs.answered;
    btn.textContent = opt;
    btn.onclick = () => {
      const isCorrect = opt === q.correct;
      qs.answered = { chosen: opt };
      if (isCorrect) qs.score++;
      logEvent('grammar', isCorrect, qs.topic);
      render();
    };
    wrap.appendChild(btn);
  });
  if (qs.answered){
    const fb = document.createElement('div');
    fb.className = 'feedback-box ' + (qs.answered.chosen === q.correct ? 'correct' : 'incorrect');
    fb.textContent = q.explanation;
    wrap.appendChild(fb);
    const next = document.createElement('button');

    next.textContent = 'Далі';
    next.onclick = () => { qs.index++; qs.answered = null; render(); };
    wrap.appendChild(next);
  }
  return wrap;
}

function dueVerbs(subsetIds){
  const now = Date.now();
  const prog = state.verbProgress || {};
  const shuffled = [...subsetIds].sort(() => Math.random() - 0.5);
  const withMeta = shuffled.map(id => ({ id, box: (prog[id] && prog[id].box) || 1, dueAt: (prog[id] && prog[id].dueAt) || 0 }));
  const due = withMeta.filter(w => w.dueAt <= now).sort((a,b) => a.box - b.box);
  const ordered = (due.length ? due : withMeta.sort((a,b) => a.box - b.box));
  return ordered.map(w => IRREGULAR_VERBS.find(v => v.id === w.id));
}

function gradeVerb(verbId, easy){
  const prog = state.verbProgress || {};
  const cur = prog[verbId] || { box:1, dueAt:0 };
  const box = easy ? Math.min(5, cur.box + 1) : 1;
  prog[verbId] = { box, dueAt: Date.now() + BOX_HOURS[box] * 3600 * 1000 };
  state.verbProgress = prog;
  storeSet('verbProgress', prog);
  logEvent('verb', easy, verbId);
}

function startVerbTrainSession(n){
  const subsetIds = IRREGULAR_VERBS.slice(0, n).map(v => v.id);
  state.verbTrainQueue = dueVerbs(subsetIds);
  state.verbTrainIndex = 0;
  state.verbTrainFlipped = false;
  goto('verbtrain');
}

function nextVerb(){
  state.verbTrainIndex++;
  state.verbTrainFlipped = false;
  render();
}

function renderVerbTrain(){
  const wrap = document.createElement('div');

  wrap.appendChild(progress);

  const card = document.createElement('div');

  card.innerHTML = state.verbTrainFlipped
    ? `<button class="speak-btn" aria-label="Прослухати">🔊</button><div><div class="word" style="font-size:20px;">${escapeHtml(v.base)}</div><div class="translation" style="font-size:17px;margin-top:6px;">${escapeHtml(v.past)}</div><div class="translation" style="font-size:17px;">${escapeHtml(v.participle)}</div></div>`
    : `<div class="word-wrap"><div class="word">${escapeHtml(v.translation)}</div></div>`;
  wrap.appendChild(card);

  if (state.verbTrainFlipped){
    const speakBtn = card.querySelector('.speak-btn');
    speakBtn.onpointerdown = (e) => e.stopPropagation();
    speakBtn.onclick = (e) => { e.stopPropagation(); speakText(v.base + ', ' + v.past + ', ' + v.participle); };
    card.onclick = () => { state.verbTrainFlipped = false; render(); };
  } else {
    card.onclick = () => { state.verbTrainFlipped = true; render(); };
  }

  const hint = document.createElement('div');
  hint.className = 'flip-hint';
  hint.textContent = state.verbTrainFlipped ? 'Тапни, щоб перевернути назад' : 'Тапни, щоб побачити 3 форми';
  wrap.appendChild(hint);

  if (state.verbTrainFlipped){
    const row = document.createElement('div');
    row.className = 'grade-row';
    const hard = document.createElement('button'); hard.className = 'grade-btn grade-hard'; hard.textContent = 'Складно';
    hard.onclick = () => { gradeVerb(v.id, false); nextVerb(); };
    const easy = document.createElement('button'); easy.className = 'grade-btn grade-easy'; easy.textContent = 'Легко';
    easy.onclick = () => { gradeVerb(v.id, true); nextVerb(); };
    row.appendChild(hard); row.appendChild(easy);
    wrap.appendChild(row);
  }
  return wrap;
}

// ---------- Personal progress analysis (on demand, one API call) ----------
function buildActivitySummary(){
  const now = Date.now();
  const week = 7 * 24 * 3600 * 1000;
  const log = state.activityLog || [];
  const last7 = log.filter(e => now - e.ts <= week);
  const prev7 = log.filter(e => now - e.ts > week && now - e.ts <= 2 * week);
  function stats(arr){
    const total = arr.length;
    const correct = arr.filter(e => e.correct).length;
    const byKind = {};
    arr.forEach(e => {
      byKind[e.kind] = byKind[e.kind] || { total:0, correct:0 };
      byKind[e.kind].total++;
      if (e.correct) byKind[e.kind].correct++;
    });
    return { total, correct, rate: total ? Math.round(correct/total*100) : null, byKind };
  }
  return { last7: stats(last7), prev7: stats(prev7), totalEver: log.length };
}

async function requestProgressAnalysis(){
  state.progressAnalysis = { loading:true, text:null };
  render();
  const summary = buildActivitySummary();
  if (summary.totalEver < 5){
    state.progressAnalysis = { loading:false, text:'Ще замало даних для аналізу — попрактикуйся трохи більше і повертайся сюди.' };
    render();
    return;
  }
  const system = "Ти — персональний супервізор з вивчення англійської мови. Аналізуєш статистику практики студента і даєш чесний, конкретний, підтримуючий висновок українською мовою: що покращилось порівняно з попереднім тижнем, де є проблеми, на що звернути увагу. Не вигадуй деталей, яких немає в даних. Пиши як людина в розмові, а не як формальний звіт зі списком.";
  const prompt = `Ось статистика практики студента у форматі JSON:\n${JSON.stringify(summary)}\n\nkind означає тип вправи: word (картки/слова), sentence (побудова речень), grammar (граматичні тести), verb (неправильні дієслова). rate — відсоток правильних відповідей. last7 — останні 7 днів, prev7 — тиждень до того. Дай короткий (3-5 речень) персональний аналіз прогресу.`;
  try{
    const text = await askClaude(prompt, system, 500);
    state.progressAnalysis = { loading:false, text };
  }catch(e){
    state.progressAnalysis = { loading:false, text:'Не вдалось отримати аналіз. Спробуй пізніше.' };
  }
  render();
}

function startWordSearch(){

    state.wsSetupError = 'Обери хоча б один пакет.';
    render();
    return;
  }
  const d = WS_DIFFICULTY[state.wsDifficulty];
  const words = pickWordsForSearch(state.wsSelectedPackIds, d.wordCount, d.size);
  if (words.length < 3){
    state.wsSetupError = 'У обраних пакетах замало придатних слів (3–' + d.size + ' літер, без пробілів). Додай слова або обери інший пакет.';
    render();
    return;
  }
  state.wsSetupError = null;
  const { grid, placed } = generateWordSearch(words, d.size, d.directions);
  const tr = {};
  state.packs.filter(pk => state.wsSelectedPackIds.includes(pk.id)).forEach(pk => pk.words.forEach(w => {
    const k = (w.word || '').toUpperCase();
    if (k && !tr[k]) tr[k] = w.translation;
  }));
  placed.forEach(pw => { pw.translation = tr[pw.word] || ''; });
  state.wsSize = d.size;
  state.wsGrid = grid;
  state.wsWords = placed;
  state.wsStart = null;
  state.wsEnd = null;
  state.wsDragging = false;
  goto('wordsearch-play');
}

function renderWordSearchPlay(){
  const wrap = document.createElement('div');

  const wordsRow = document.createElement('div');
  wordsRow.className = 'ws-words';
  state.wsWords.forEach(w => {
    const chip = document.createElement('div');
    chip.className = 'ws-word-chip' + (w.found ? ' found' : '');
    chip.textContent = w.found ? (w.translation ? w.translation + ' → ' + w.word : w.word) : (w.translation || w.word);
    wordsRow.appendChild(chip);
  });
  wrap.appendChild(wordsRow);

  const allFound = state.wsWords.every(w => w.found);
  if (allFound){
    const done = document.createElement('div');
    done.className = 'done-msg';
    done.textContent = `Усі ${state.wsWords.length} слів знайдено 🎉`;
    wrap.appendChild(done);
    const again = document.createElement('button');
    again.className = 'primary-btn';
    again.textContent = 'Нова гра (ті ж налаштування)';
    again.onclick = () => startWordSearch();
    wrap.appendChild(again);
    return wrap;
  }

  const gridEl = document.createElement('div');
  gridEl.className = 'ws-grid';
  gridEl.style.gridTemplateColumns = `repeat(${state.wsSize}, 1fr)`;
  const cellEls = [];

  function refreshSelection(){
    cellEls.forEach(el => el.classList.remove('selected'));
    if (!state.wsStart || !state.wsEnd) return;
    const path = wsComputePath(state.wsStart.r, state.wsStart.c, state.wsEnd.r, state.wsEnd.c);
    path.forEach(p => {
      const idx = p.r * state.wsSize + p.c;
      if (cellEls[idx]) cellEls[idx].classList.add('selected');
    });
  }

  function finishDrag(){
    if (!state.wsDragging) return;
    state.wsDragging = false;
    const path = wsComputePath(state.wsStart.r, state.wsStart.c, state.wsEnd.r, state.wsEnd.c);
    const key = path.map(p => p.r+','+p.c).join('|');
    const keyRev = [...path].reverse().map(p => p.r+','+p.c).join('|');
    const match = state.wsWords.find(w => !w.found && (w.pathKey === key || w.pathKey === keyRev));
    if (match){
      match.found = true;
      logEvent('wordsearch', true, match.word);
    }
    state.wsStart = null;
    state.wsEnd = null;
    render();
  }

  for (let r=0; r<state.wsSize; r++){
    for (let c=0; c<state.wsSize; c++){
      const cell = document.createElement('div');
      cell.className = 'ws-cell';
      cell.textContent = state.wsGrid[r][c];
      cell.onpointerdown = (e) => {
        e.preventDefault();
        state.wsDragging = true;
        state.wsStart = { r, c };
        state.wsEnd = { r, c };
        refreshSelection();
        window.addEventListener('pointerup', finishDrag, { once:true });
      };
      cellEls.push(cell);
      gridEl.appendChild(cell);
    }
  }

  gridEl.onpointermove = (e) => {
    if (!state.wsDragging) return;
    const touch = e.touches ? e.touches[0] : e;
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const idx = cellEls.indexOf(el);
    if (idx === -1) return;
    const r = Math.floor(idx / state.wsSize), c = idx % state.wsSize;
    state.wsEnd = { r, c };
    refreshSelection();
  };

  // mark already-found words' cells
  state.wsWords.filter(w => w.found).forEach(w => {
    w.path.forEach(p => {
      const idx = p.r * state.wsSize + p.c;
      if (cellEls[idx]) cellEls[idx].classList.add('found');
    });
  });

  wrap.appendChild(gridEl);

  const hint = document.createElement('div');
  hint.className = 'flip-hint';
  hint.textContent = 'Проведи пальцем по літерах, щоб виділити слово';
  wrap.appendChild(hint);

  return wrap;
}

function gameShuffle(arr){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- Hangman ----------
const HM_LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

function startHangman(){
  const pool = gamePool().filter(w => /^[A-Za-z]+$/.test(w.word) && w.word.length >= 3 && w.word.length <= 12);
  if (!pool.length){
    state.gameSetupError = 'У обраних пакетах немає придатних слів (3–12 літер, без пробілів і дефісів).';
    render();
    return;
  }
  state.hmState = { queue: gameShuffle(pool).slice(0, 10), index: 0, guessed: [], lives: 6, wins: 0 };
  goto('hangman-play');
}

function hmStatus(hm){
  const word = hm.queue[hm.index].word.toUpperCase();
  const won = word.split('').every(ch => hm.guessed.includes(ch));
  const lost = hm.lives <= 0;
  return { word, won, lost, over: won || lost };
}

function hmGuess(letter){
  const hm = state.hmState;
  if (hm.guessed.includes(letter)) return;
  const before = hmStatus(hm);
  if (before.over) return;
  hm.guessed.push(letter);
  if (!before.word.includes(letter)) hm.lives--;
  const after = hmStatus(hm);
  if (after.over){
    if (after.won) hm.wins++;
    logEvent('game', after.won, 'hangman');
  }
  render();
}

function renderHangman(){
  const wrap = document.createElement('div');
  const hm = state.hmState;
  if (!hm) return wrap;

  if (hm.index >= hm.queue.length){
    const done = document.createElement('div');
    done.className = 'done-msg';
    done.textContent = `Вгадано ${hm.wins} з ${hm.queue.length} 🎉`;
    wrap.appendChild(done);
    const again = document.createElement('button');
    again.className = 'primary-btn';
    again.textContent = 'Зіграти ще раз';
    again.onclick = () => startHangman();
    wrap.appendChild(again);
    return wrap;
  }

  const item = hm.queue[hm.index];
  const st = hmStatus(hm);

  const progress = document.createElement('div');
  progress.className = 'progress-line';
  progress.textContent = `${hm.index + 1} / ${hm.queue.length}`;
  wrap.appendChild(progress);

  const lives = document.createElement('div');
  lives.className = 'hm-lives';
  lives.textContent = '❤️'.repeat(Math.max(hm.lives, 0)) + '🖤'.repeat(6 - Math.max(hm.lives, 0));
  wrap.appendChild(lives);

  const box = document.createElement('div');
  box.className = 'prompt-box';
  box.style.margin = '0 0 4px';
  box.innerHTML = `<div class="ukr">${escapeHtml(item.translation)}</div>`;
  wrap.appendChild(box);

  const wordEl = document.createElement('div');
  wordEl.className = 'hm-word';
  st.word.split('').forEach(ch => {
    const l = document.createElement('div');
    const guessed = hm.guessed.includes(ch);
    l.className = 'hm-letter' + (!guessed && st.lost ? ' revealed-miss' : '');
    l.textContent = guessed || st.lost ? ch : '';
    wordEl.appendChild(l);
  });
  wrap.appendChild(wordEl);

  const kb = document.createElement('div');
  kb.className = 'kb-grid';
  HM_LETTERS.forEach(letter => {
    const key = document.createElement('button');
    key.className = 'kb-key';
    const used = hm.guessed.includes(letter);
    if (used) key.classList.add(st.word.includes(letter) ? 'hit' : 'miss');
    key.disabled = used || st.over;
    key.textContent = letter;
    key.onclick = () => hmGuess(letter);
    kb.appendChild(key);
  });
  wrap.appendChild(kb);

  if (st.over){
    const fb = document.createElement('div');
    fb.className = 'feedback-box ' + (st.won ? 'correct' : 'incorrect');
    fb.textContent = st.won ? `Правильно! ${item.word}` : `Слово було: ${item.word}`;
    if (item.example){
      const ex = document.createElement('div');
      ex.style.marginTop = '6px';
      ex.style.fontStyle = 'italic';
      ex.textContent = item.example;
      fb.appendChild(ex);
    }
    wrap.appendChild(fb);

    const row = document.createElement('div');
    row.style.display = 'flex';
    row.style.gap = '10px';
    const speak = document.createElement('button');
    speak.className = 'secondary-btn';
    speak.textContent = '🔊';
    speak.style.width = '64px';
    speak.onclick = () => speakText(item.word);
    const next = document.createElement('button');
    next.className = 'primary-btn';
    next.style.marginTop = '10px';
    next.textContent = hm.index === hm.queue.length - 1 ? 'Результат' : 'Наступне слово';
    next.onclick = () => { hm.index++; hm.guessed = []; hm.lives = 6; render(); };
    row.appendChild(speak);
    row.appendChild(next);
    wrap.appendChild(row);
  }
  return wrap;
}

// ---------- Sentence builder ----------
function startBuilder(){
  const pool = gamePool().filter(w => {
    if (!w.example) return false;
    const n = w.example.trim().split(/\s+/).length;
    return n >= 3 && n <= 14;
  });
  if (!pool.length){
    state.gameSetupError = 'У обраних пакетах немає прикладів речень довжиною 3–14 слів.';
    render();
    return;
  }
  const items = gameShuffle(pool).slice(0, 10).map(w => {
    const example = w.example.trim().split(/\s+/).join(' ');
    const tokens = example.split(' ').map((text, id) => ({ id, text }));
    const orderKey = tokens.map(t => t.id).join();
    let bank = gameShuffle(tokens);
    for (let k = 0; k < 6 && bank.map(t => t.id).join() === orderKey; k++) bank = gameShuffle(tokens);
    return { word: w.word, translation: w.translation, example, tokens, bank, line: [], checked: null };
  });
  state.sbState = { items, index: 0, score: 0 };
  goto('builder-play');
}

function sbCheck(){
  const item = state.sbState.items[state.sbState.index];
  if (item.checked || item.line.length !== item.tokens.length) return;
  const answer = item.line.map(id => item.tokens[id].text).join(' ');
  const correct = answer === item.example;
  item.checked = { correct };
  if (correct) state.sbState.score++;
  logEvent('game', correct, 'builder');
  render();
}

function renderBuilder(){
  const wrap = document.createElement('div');
  const sb = state.sbState;
  if (!sb) return wrap;

  if (sb.index >= sb.items.length){
    const done = document.createElement('div');
    done.className = 'done-msg';
    done.textContent = `Правильно: ${sb.score} з ${sb.items.length} 🎉`;
    wrap.appendChild(done);
    const again = document.createElement('button');
    again.className = 'primary-btn';
    again.textContent = 'Зіграти ще раз';
    again.onclick = () => startBuilder();
    wrap.appendChild(again);
    return wrap;
  }

  const item = sb.items[sb.index];
  const progress = document.createElement('div');
  progress.className = 'progress-line';
  progress.textContent = `${sb.index + 1} / ${sb.items.length}`;
  wrap.appendChild(progress);

  const box = document.createElement('div');
  box.className = 'prompt-box';
  box.style.margin = '0 0 14px';
  box.innerHTML = `<div style="color:var(--slate);font-size:13px;margin-bottom:6px;">Склади речення зі словом</div><div class="ukr">${escapeHtml(item.word)} — ${escapeHtml(item.translation)}</div>`;
  wrap.appendChild(box);

  const line = document.createElement('div');
  line.className = 'sb-line';
  item.line.forEach(id => {
    const tok = document.createElement('button');
    tok.className = 'sb-tok in-line';
    tok.textContent = item.tokens[id].text;
    tok.disabled = !!item.checked;
    tok.onclick = () => { item.line = item.line.filter(x => x !== id); render(); };
    line.appendChild(tok);
  });
  wrap.appendChild(line);

  const bank = document.createElement('div');
  bank.className = 'sb-bank';
  item.bank.filter(t => !item.line.includes(t.id)).forEach(t => {
    const tok = document.createElement('button');
    tok.className = 'sb-tok';
    tok.textContent = t.text;
    tok.disabled = !!item.checked;
    tok.onclick = () => { item.line.push(t.id); render(); };
    bank.appendChild(tok);
  });
  wrap.appendChild(bank);

  if (!item.checked){
    const check = document.createElement('button');
    check.className = 'primary-btn';
    check.textContent = 'Перевірити';
    check.disabled = item.line.length !== item.tokens.length;
    check.onclick = sbCheck;
    wrap.appendChild(check);
    if (item.line.length){
      const reset = document.createElement('button');
      reset.className = 'secondary-btn';
      reset.textContent = 'Почати спочатку';
      reset.onclick = () => { item.line = []; render(); };
      wrap.appendChild(reset);
    }
  } else {
    const fb = document.createElement('div');
    fb.className = 'feedback-box ' + (item.checked.correct ? 'correct' : 'incorrect');
    fb.textContent = item.checked.correct ? 'Правильно!' : `Правильне речення: ${item.example}`;
    wrap.appendChild(fb);

    const row = document.createElement('div');
    row.style.display = 'flex';
    row.style.gap = '10px';
    const speak = document.createElement('button');
    speak.className = 'secondary-btn';
    speak.textContent = '🔊';
    speak.style.width = '64px';
    speak.onclick = () => speakText(item.example);
    const next = document.createElement('button');
    next.className = 'primary-btn';
    next.style.marginTop = '10px';
    next.textContent = sb.index === sb.items.length - 1 ? 'Результат' : 'Далі';
    next.onclick = () => { sb.index++; render(); };
    row.appendChild(speak);
    row.appendChild(next);
    wrap.appendChild(row);
  }
  return wrap;
}

// ---------- Speed Match ----------
let smTimerId = null;
const SM_DURATION = 60;

async function startSpeed(){
  const all = state.packs.flatMap(p => p.words);
  const pool = gamePool();
  if (all.length < 4 || !pool.length){
    state.gameSetupError = 'Потрібно щонайменше 4 слова в пакетах, щоб було з чого обирати варіанти.';
    render();
    return;
  }
  const best = (await storeGet('speedBest')) || 0;
  state.smState = {
    pool: gameShuffle(pool), poolIdx: 0, score: 0, streak: 0, correct: 0, total: 0,
    timeLeft: SM_DURATION, over: false, current: null, flash: null, best, newBest: false,
  };
  smNextQuestion();
  const endAt = Date.now() + SM_DURATION * 1000;
  if (smTimerId) clearInterval(smTimerId);
  smTimerId = setInterval(() => {
    const sm = state.smState;
    if (!sm || state.route !== 'speed-play' || sm.over){
      clearInterval(smTimerId);
      smTimerId = null;
      return;
    }
    sm.timeLeft = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
    const el = document.getElementById('sm-timer');
    if (el){
      el.textContent = '⏱ ' + sm.timeLeft;
      el.classList.toggle('low', sm.timeLeft <= 10);
    }
    if (sm.timeLeft <= 0) smFinish();
  }, 250);
  goto('speed-play');
}

function smNextQuestion(){
  const sm = state.smState;
  if (sm.poolIdx >= sm.pool.length){
    sm.pool = gameShuffle(sm.pool);
    sm.poolIdx = 0;
  }
  const word = sm.pool[sm.poolIdx++];
  const seen = new Set([word.translation]);
  const distractors = [];
  for (const w of gameShuffle(state.packs.flatMap(p => p.words))){
    if (seen.has(w.translation)) continue;
    seen.add(w.translation);
    distractors.push(w.translation);
    if (distractors.length === 3) break;
  }
  sm.current = { word, options: gameShuffle([...distractors, word.translation]) };
}

async function smFinish(){
  const sm = state.smState;
  if (!sm || sm.over) return;
  sm.over = true;
  if (smTimerId){ clearInterval(smTimerId); smTimerId = null; }
  if (sm.score > sm.best){
    sm.newBest = true;
    sm.best = sm.score;
    await storeSet('speedBest', sm.score);
  }
  render();
}

function smAnswer(option){
  const sm = state.smState;
  if (!sm || sm.over) return;
  const word = sm.current.word;
  const ok = option === word.translation;
  sm.total++;
  if (ok){
    sm.correct++;
    const gain = 10 + Math.min(sm.streak, 5) * 2;
    sm.score += gain;
    sm.streak++;
    sm.flash = { ok:true, text:`+${gain}` };
  } else {
    sm.streak = 0;
    sm.flash = { ok:false, text:`${word.word} = ${word.translation}` };
  }
  logEvent('game', ok, 'speed');
  smNextQuestion();
  render();
}

function renderSpeed(){
  const wrap = document.createElement('div');
  const sm = state.smState;
  if (!sm) return wrap;

  if (sm.over){
    const done = document.createElement('div');
    done.className = 'done-msg';
    const acc = sm.total ? Math.round(sm.correct / sm.total * 100) : 0;
    done.innerHTML = `Час вийшов!<br><strong style="font-size:28px;font-family:'IBM Plex Serif',serif;">${sm.score}</strong> очок<br>Правильно ${sm.correct} з ${sm.total} (${acc}%)<br>${sm.newBest ? 'Новий рекорд! 🏆' : 'Рекорд: ' + sm.best}`;
    wrap.appendChild(done);
    const again = document.createElement('button');
    again.className = 'primary-btn';
    again.textContent = 'Ще раз';
    again.onclick = () => startSpeed();
    wrap.appendChild(again);
    return wrap;
  }

  const hud = document.createElement('div');
  hud.className = 'sm-hud';
  const score = document.createElement('span');
  score.textContent = `${sm.score}${sm.streak >= 3 ? '  🔥×' + sm.streak : ''}`;
  const timer = document.createElement('span');
  timer.id = 'sm-timer';
  timer.className = 'sm-timer' + (sm.timeLeft <= 10 ? ' low' : '');
  timer.textContent = '⏱ ' + sm.timeLeft;
  hud.appendChild(score);
  hud.appendChild(timer);
  wrap.appendChild(hud);

  const box = document.createElement('div');
  box.className = 'prompt-box';
  box.innerHTML = `<div class="ukr" style="text-align:center;font-size:24px;">${escapeHtml(sm.current.word.word)}</div>`;
  wrap.appendChild(box);

  sm.current.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => smAnswer(opt);
    wrap.appendChild(btn);
  });

  if (sm.flash){
    const fl = document.createElement('div');
    fl.className = 'progress-line';
    fl.style.color = sm.flash.ok ? 'var(--sage)' : 'var(--rust)';
    fl.textContent = sm.flash.ok ? sm.flash.text : '✗ ' + sm.flash.text;
    wrap.appendChild(fl);
  }
  return wrap;
}
