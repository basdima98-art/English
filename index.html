<html lang="uk">

<style>
  :root{
    --ink:#1B2430;
    --ink-2:#232E3C;
    --paper:#F6F0E4;
    --paper-2:#ECE3CF;
    --cream-text:#EDE6D6;
    --dark-text:#2A2118;
    --sage:#4C7A5E;

    --slate:#96A0B0;

  .stat-row{

  .option-btn{

    align-items:center;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius-ui);

  .replay-btn{

  .google-btn{

  .signout-btn{

<body>
<div id="app"></div>

<script>
// ==== FIREBASE CONFIG ====
// Встав сюди свої значення з Firebase Console → Project settings → General → Your apps → Web app
const firebaseConfig = {
  apiKey: "AIzaSyBPzZ-z0VyDo6iKatlcMaxiPv0jD11ekKo",
  authDomain: "english-78ba3.firebaseapp.com",
  projectId: "english-78ba3",
  storageBucket: "english-78ba3.firebasestorage.app",
  messagingSenderId: "779206773993",
  appId: "1:779206773993:web:4b08bbea159b46214df478"
};

let auth = null, db = null;
try{
  if (typeof firebase !== 'undefined' && firebaseConfig.apiKey !== "ТВІЙ_apiKey"){
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
  }
}catch(e){ console.error('Firebase init failed', e); window.__fbInitError = (e && e.message) ? e.message : String(e); }

function signInWithGoogle(){
  if (!auth) return;
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(e => {
    console.error(e);
    window.__fbAuthError = (e && e.message) ? e.message : String(e);
    render();
  });
}
function signOutUser(){
  if (!auth) return;
  auth.signOut();
}

const TENSE_OPTIONS = [
  "Present Simple","Present Continuous","Present Perfect","Present Perfect Continuous",
  "Past Simple","Past Continuous","Past Perfect","Past Perfect Continuous",
  "Future Simple","Future Continuous","Future Perfect","Future Perfect Continuous"
];
const BOX_HOURS = [0, 4, 24, 72, 168, 336]; // index = box (1..5), box0 unused

let state = {
  route: 'home',
  theme: 'dark',
  user: null,
  packs: [],
  coveredTenses: [],
  currentPackId: null,
  confirmDeletePack: false,
  sessionQueue: [],
  sessionIndex: 0,
  flipped: false,
  exInput: '',
  exResult: null,
  matchState: null,
  sentenceState: null,
  addMode: 'new',
  addTargetPackId: null,
  chatMessages: [],
  chatInput: '',
  chatLoading: false,
};

function uid(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }

async function storeGet(key){
  try{
    if (state.user && db){
      const doc = await db.collection('users').doc(state.user.uid).collection('data').doc(key).get();
      return doc.exists ? doc.data().value : null;
    }
    if (window.storage && typeof window.storage.get === 'function'){
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : null;
    }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function storeSet(key, value){
  try{
    if (state.user && db){
      await db.collection('users').doc(state.user.uid).collection('data').doc(key).set({ value });
      return;
    }
    if (window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(key, JSON.stringify(value), false);
    } else {
      localStorage.setItem(key, JSON.stringify(value));
    }
  }catch(e){ console.error('storage error', e); }
}

function seedDemoPack(){
  return {
    id: uid(),
    name: 'Travel (демо)',
    words: [
      { id: uid(), word:'airport', translation:'аеропорт', example:'We arrived at the airport two hours early.', box:1, dueAt:Date.now() },
      { id: uid(), word:'luggage', translation:'багаж', example:'I forgot to label my luggage.', box:1, dueAt:Date.now() },
      { id: uid(), word:'ticket', translation:'квиток', example:'She bought a ticket for the morning flight.', box:1, dueAt:Date.now() },
      { id: uid(), word:'delay', translation:'затримка', example:'The delay lasted almost three hours.', box:1, dueAt:Date.now() },
      { id: uid(), word:'passport', translation:'паспорт', example:"Don't forget your passport at the counter.", box:1, dueAt:Date.now() },
      { id: uid(), word:'boarding', translation:'посадка', example:'Boarding starts thirty minutes before departure.', box:1, dueAt:Date.now() },
      { id: uid(), word:'gate', translation:'вихід на посадку', example:'Our gate changed at the last minute.', box:1, dueAt:Date.now() },
      { id: uid(), word:'refund', translation:'повернення коштів', example:'They offered a refund for the cancelled flight.', box:1, dueAt:Date.now() },
    ]
  };
}

async function loadAllData(){
  const packs = await storeGet('packs');
  const tenses = await storeGet('coveredTenses');
  const theme = await storeGet('theme');
  const chat = await storeGet('chatMessages');
  state.packs = (packs && packs.length) ? packs : (state.user ? [] : [seedDemoPack()]);
  if ((!packs || !packs.length) && !state.user) await storeSet('packs', state.packs);
  state.coveredTenses = tenses || ["Present Simple","Present Perfect"];
  state.theme = theme || 'dark';
  state.chatMessages = chat || [];
  document.body.setAttribute('data-theme', state.theme);
}

async function init(){
  if (auth){
    auth.onAuthStateChanged(async (user) => {
      state.user = user;
      await loadAllData();
      render();
    });
  } else {
    await loadAllData();
    render();
  }
}

async function toggleTheme(){
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.body.setAttribute('data-theme', state.theme);
  await storeSet('theme', state.theme);
  render();
}

async function savePacks(){ await storeSet('packs', state.packs); }
async function saveTenses(){ await storeSet('coveredTenses', state.coveredTenses); }

async function callClaudeAPI(body){
  try{
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('direct call unavailable');
    return await res.json();
  }catch(e){
    const res2 = await fetch("/api/claude", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    return await res2.json();
  }
}

async function askClaude(userPrompt, systemPrompt){
  const body = {
    model: "claude-sonnet-4-6",
    max_tokens: 1000,
    messages: [{ role: "user", content: userPrompt }]
  };
  if (systemPrompt) body.system = systemPrompt;
  const data = await callClaudeAPI(body);
  const block = (data.content || []).find(b => b.type === "text");
  return block ? block.text : "";
}

async function askClaudeConversation(messages, systemPrompt){
  const body = {
    model: "claude-sonnet-4-6",
    max_tokens: 1000,
    messages: messages.map(m => ({ role: m.role, content: m.content }))
  };
  if (systemPrompt) body.system = systemPrompt;
  const data = await callClaudeAPI(body);
  const block = (data.content || []).find(b => b.type === "text");
  return block ? block.text : "";
}

function parseJSONLoose(text){
  const cleaned = text.replace(/```json/g,'').replace(/```/g,'').trim();
  return JSON.parse(cleaned);
}

function goto(route, extra){
  state.route = route;
  Object.assign(state, extra || {});
  render();
}

// ---------- Card generation ----------
async function generateCards(packNameOrTargetId, rawText, appendToExisting){
  const system = "Ти генеруєш навчальні картки англійської мови для україномовного користувача рівня A2-B1. Завжди повертай ЛИШЕ валідний JSON, без пояснень і без markdown-огорожі.";
  const prompt = `Ось текст або список слів для вивчення:\n\n${rawText}\n\nСтвори JSON-масив об'єктів формату {"word":"...", "translation":"...", "example":"...", "transcription":"..."} для значущих слів чи фраз звідси (пропускай артиклі, займенники, прийменники, якщо це суцільний текст). "transcription" — якщо у вихідному тексті вже є транскрипція (IPA чи вимова кирилицею) — візьми її; якщо немає — згенеруй стандартну IPA-транскрипцію сам. "example" — просте речення англійською з цим словом. Максимум 20 об'єктів. Поверни лише масив.`;
  const raw = await askClaude(prompt, system);
  const items = parseJSONLoose(raw);
  const words = items.map(it => ({
    id: uid(),
    word: it.word,
    translation: it.translation,
    example: it.example || "",
    transcription: it.transcription || "",
    box: 1,
    dueAt: Date.now()
  }));
  if (appendToExisting){
    const pack = state.packs.find(p => p.id === packNameOrTargetId);
    pack.words.push(...words);
    await savePacks();
    return pack;
  }
  const pack = { id: uid(), name: packNameOrTargetId, words };
  state.packs.push(pack);
  await savePacks();
  return pack;
}

// ---------- Flashcards ----------
function speakText(text){
  if (!text || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  window.speechSynthesis.speak(utter);
}

function dueWords(pack){
  const now = Date.now();
  const due = pack.words.filter(w => w.dueAt <= now).sort((a,b)=>a.box-b.box);
  return due.length ? due : [...pack.words].sort((a,b)=>a.box-b.box);
}

function gradeCard(pack, word, easy){
  if (easy){
    word.box = Math.min(5, word.box + 1);
  } else {
    word.box = 1;
  }
  word.dueAt = Date.now() + BOX_HOURS[word.box] * 3600 * 1000;
}

function reinsertForRetry(word){
  const remaining = state.sessionQueue.length - (state.sessionIndex + 1);
  if (remaining <= 0){
    state.sessionQueue.push(word);
    return;
  }
  const offset = 1 + Math.floor(Math.random() * remaining);
  state.sessionQueue.splice(state.sessionIndex + offset, 0, word);
}

function attachSwipeHandlers(card, pack, word){
  let startX = 0, dx = 0, dragging = false, moved = false;
  const knowLabel = card.querySelector('.swipe-label.know');
  const forgotLabel = card.querySelector('.swipe-label.forgot');
  const THRESHOLD = 90;

  card.onpointerdown = (e) => {
    dragging = true; moved = false; dx = 0;
    startX = e.clientX;
    card.style.transition = 'none';
    card.setPointerCapture(e.pointerId);
  };
  card.onpointermove = (e) => {
    if (!dragging) return;
    dx = e.clientX - startX;
    if (Math.abs(dx) > 5) moved = true;
    const rotate = dx / 18;
    card.style.transform = `translateX(${dx}px) rotate(${rotate}deg)`;
    const t = Math.min(Math.abs(dx) / THRESHOLD, 1);
    if (dx > 0){ knowLabel.style.opacity = t; forgotLabel.style.opacity = 0; }
    else if (dx < 0){ forgotLabel.style.opacity = t; knowLabel.style.opacity = 0; }
    else { knowLabel.style.opacity = 0; forgotLabel.style.opacity = 0; }
  };
  const finish = (e) => {
    if (!dragging) return;
    dragging = false;
    card.style.transition = 'transform 0.28s ease, opacity 0.28s ease';
    if (dx > THRESHOLD){
      card.style.transform = `translateX(700px) rotate(20deg)`;
      card.style.opacity = '0';
      gradeCard(pack, word, true);
      savePacks();
      setTimeout(nextCard, 220);
    } else if (dx < -THRESHOLD){
      card.style.transform = `translateX(-700px) rotate(-20deg)`;
      card.style.opacity = '0';
      gradeCard(pack, word, false);
      reinsertForRetry(word);
      savePacks();
      setTimeout(nextCard, 220);
    } else {
      card.style.transform = 'translateX(0) rotate(0)';
      knowLabel.style.opacity = 0;
      forgotLabel.style.opacity = 0;
      if (!moved){ state.flipped = true; render(); }
    }
    dx = 0;
  };
  card.onpointerup = finish;
  card.onpointercancel = finish;
}

function nextCard(){
  state.sessionIndex += 1;
  state.flipped = false;
  render();
}

// ---------- Match ----------
function startMatchSession(){
  const pack = currentPack();
  const words = [...pack.words].sort(()=>Math.random()-0.5).slice(0,6);
  const left = words.map(w => ({ id:w.id, text:w.word })).sort(()=>Math.random()-0.5);
  const right = words.map(w => ({ id:w.id, text:w.translation })).sort(()=>Math.random()-0.5);
  state.matchState = { left, right, selectedLeft:null, selectedRight:null, matched:[], wrong:null };
  goto('match');
}

function renderMatch(){
  const wrap = document.createElement('div');
  const ms = state.matchState;
  const cols = document.createElement('div');
  cols.className = 'match-cols';
  const colL = document.createElement('div'); colL.className = 'match-col';
  const colR = document.createElement('div'); colR.className = 'match-col';

  ms.left.forEach(item => {
    const tile = document.createElement('div');
    tile.className = 'match-tile';
    if (ms.matched.includes(item.id)) tile.classList.add('matched');
    if (ms.selectedLeft === item.id) tile.classList.add('selected');
    if (ms.wrong === item.id) tile.classList.add('wrong');
    tile.textContent = item.text;
    tile.onclick = () => { if (!ms.matched.includes(item.id)){ ms.selectedLeft = item.id; checkMatch(); render(); } };
    colL.appendChild(tile);
  });
  ms.right.forEach(item => {
    const tile = document.createElement('div');
    tile.className = 'match-tile';
    if (ms.matched.includes(item.id)) tile.classList.add('matched');
    if (ms.selectedRight === item.id) tile.classList.add('selected');
    tile.textContent = item.text;
    tile.onclick = () => { if (!ms.matched.includes(item.id)){ ms.selectedRight = item.id; checkMatch(); render(); } };
    colR.appendChild(tile);
  });
  cols.appendChild(colL); cols.appendChild(colR);
  wrap.appendChild(cols);

  if (ms.matched.length === ms.left.length){
    const done = document.createElement('div');
    done.className = 'done-msg';
    done.textContent = 'Усі пари знайдено 🎉';
    wrap.appendChild(done);
  }
  return wrap;
}

function checkMatch(){
  const ms = state.matchState;
  if (ms.selectedLeft && ms.selectedRight){
    if (ms.selectedLeft === ms.selectedRight){
      ms.matched.push(ms.selectedLeft);
      ms.selectedLeft = null; ms.selectedRight = null; ms.wrong = null;
    } else {
      ms.wrong = ms.selectedLeft;
      const badLeft = ms.selectedLeft, badRight = ms.selectedRight;
      setTimeout(() => {
        ms.selectedLeft = null; ms.selectedRight = null; ms.wrong = null;
        render();
      }, 600);
    }
  }
}

// ---------- Write ----------

}

// ---------- Fill the gap ----------
function buildGapSentence(word){
  if (!word.example) return null;
  const re = new RegExp('\\b' + word.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\w*', 'i');
  if (!re.test(word.example)) return null;
  return word.example.replace(re, '____');
}

function startGapSession(){
  const pack = currentPack();
  const withGap = dueWords(pack).filter(w => buildGapSentence(w));
  state.sessionQueue = withGap.length ? withGap : dueWords(pack);
  state.sessionIndex = 0;
  state.exInput = '';
  state.exResult = null;
  goto('gap');
}

function renderGap(){
  const wrap = document.createElement('div');

  const progress = document.createElement('div');

      gradeCard(pack, word, ok);

      await savePacks();
      render();
    };
    wrap.appendChild(btn);
  } else {
    const fb = document.createElement('div');
    fb.className = 'feedback-box ' + (state.exResult ? 'correct' : 'incorrect');
    fb.textContent = state.exResult ? 'Правильно!' : `Правильна відповідь: ${word.word}`;
    wrap.appendChild(fb);
    const next = document.createElement('button');
    next.className = 'primary-btn';
    next.textContent = 'Далі';
    next.onclick = () => { state.sessionIndex++; state.exInput=''; state.exResult=null; render(); };

// ---------- Multiple choice ----------
function startChoiceSession(){
  const pack = currentPack();
  const pool = state.packs.flatMap(p => p.words);
  const queue = dueWords(pack).map(w => {
    const distractors = pool
      .filter(x => x.id !== w.id && x.translation !== w.translation)
      .sort(() => Math.random() - 0.5)
      .slice(0, 3)
      .map(x => x.translation);
    const options = [...distractors, w.translation].sort(() => Math.random() - 0.5);
    return { word: w, options };
  });
  state.sessionQueue = queue;
  state.sessionIndex = 0;
  state.exResult = null;
  goto('choice');
}

function renderChoice(){
  const wrap = document.createElement('div');
  const pack = currentPack();
  if (state.sessionIndex >= state.sessionQueue.length){ wrap.appendChild(doneMsg()); return wrap; }
  const { word, options } = state.sessionQueue[state.sessionIndex];
  const progress = document.createElement('div');
  progress.className = 'progress-line';
  progress.textContent = `${state.sessionIndex + 1} / ${state.sessionQueue.length}`;
  wrap.appendChild(progress);

  const box = document.createElement('div');
  box.className = 'prompt-box';
  box.innerHTML = `<div class="ukr">${escapeHtml(word.word)}</div>`;
  wrap.appendChild(box);

  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    if (state.exResult){
      if (opt === word.translation) btn.classList.add('correct');
      else if (opt === state.exResult.chosen) btn.classList.add('wrong');
    }
    btn.disabled = !!state.exResult;
    btn.textContent = opt;
    btn.onclick = async () => {
      const isCorrect = opt === word.translation;
      state.exResult = { chosen: opt };
      gradeCard(pack, word, isCorrect);
      if (!isCorrect) reinsertForRetry(word);
      await savePacks();
      render();
      setTimeout(() => { state.sessionIndex++; state.exResult = null; render(); }, 900);
    };
    wrap.appendChild(btn);
  });
  return wrap;
}

// ---------- Sentence ----------
function startSentenceSession(){
  state.sentenceState = { loading:true, data:null, answer:'', feedback:null, checking:false };
  goto('sentence');
  loadSentence();
}

async function loadSentence(){
  const pack = currentPack();
  const tenses = state.coveredTenses.length ? state.coveredTenses : ["Present Simple"];
  const words = pack.words.map(w=>w.word);
  const system = "Ти — викладач англійської для україномовного студента рівня A2. Ти складаєш вправи на переклад речення з української на англійську.";
  const prompt = `Дозволені часові форми: ${tenses.join(", ")}.\nСлова з пакету: ${words.join(", ")}.\nСклади ОДНЕ речення українською мовою, природний переклад якого англійською вимагає однієї з дозволених часових форм. Постарайся використати одне зі слів списку (у потрібній формі). Поверни ЛИШЕ JSON: {"ukrainian":"...", "expected_tense":"...", "target_word":"..."}`;
  try{
    const raw = await askClaude(prompt, system);
    const data = parseJSONLoose(raw);
    state.sentenceState = { loading:false, data, answer:'', feedback:null, checking:false };
  }catch(e){
    state.sentenceState = { loading:false, data:null, answer:'', feedback:{error:true}, checking:false };
  }
  render();
}

async function checkSentence(){
  const ss = state.sentenceState;
  if (!ss.answer.trim()) return;
  ss.checking = true;
  render();
  const system = "Ти перевіряєш переклад студента з української на англійську. Фокусуйся на граматичній правильності, правильній часовій формі та вживанні цільового слова. Пояснюй так, як робив би це в живій розмові: доброзичливо, конкретно, з поясненням граматики там, де є помилка, не обмежуй себе кількістю речень.";
  const prompt = `Українське речення: "${ss.data.ukrainian}"\nОчікувана часова форма: ${ss.data.expected_tense}\nЦільове слово: ${ss.data.target_word}\nВідповідь студента: "${ss.answer}"\n\nПоверни ЛИШЕ JSON: {"correct": true/false, "feedback":"розмовне пояснення українською — чому правильно чи неправильно, з поясненням граматики за потреби", "corrected":"виправлений варіант, якщо є помилки, інакше порожній рядок"}`;
  try{
    const raw = await askClaude(prompt, system);
    ss.feedback = parseJSONLoose(raw);
  }catch(e){
    ss.feedback = { error:true };
  }
  ss.checking = false;
  render();
}

function renderSentence(){
  const wrap = document.createElement('div');
  const ss = state.sentenceState;
  if (ss.loading){
    const l = document.createElement('div'); l.className='loading'; l.textContent='Готую речення...';
    wrap.appendChild(l);
    return wrap;
  }
  if (!ss.data){
    const l = document.createElement('div'); l.className='loading'; l.textContent='Не вдалось згенерувати речення. Спробуй ще раз.';
    wrap.appendChild(l);
    return wrap;
  }
  const box = document.createElement('div');
  box.className = 'prompt-box';
  box.innerHTML = `<div class="ukr">${escapeHtml(ss.data.ukrainian)}</div>`;
  wrap.appendChild(box);

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Переклади англійською...';
  input.value = ss.answer;
  input.oninput = (e) => { ss.answer = e.target.value; };
  wrap.appendChild(input);

  const btn = document.createElement('button');
  btn.className = 'primary-btn';
  btn.textContent = ss.checking ? 'Перевіряю...' : 'Перевірити';
  btn.disabled = ss.checking;
  btn.onclick = checkSentence;
  wrap.appendChild(btn);

  if (ss.feedback && !ss.feedback.error){
    const fb = document.createElement('div');
    fb.className = 'feedback-box ' + (ss.feedback.correct ? 'correct' : 'incorrect');
    let html = `<div>${escapeHtml(ss.feedback.feedback || '')}</div>`;
    if (ss.feedback.corrected){
      html += `<div style="margin-top:8px;"><strong>Варіант:</strong> ${escapeHtml(ss.feedback.corrected)}</div>`;
    }
    fb.innerHTML = html;
    wrap.appendChild(fb);

    const next = document.createElement('button');
    next.className = 'secondary-btn';
    next.textContent = 'Наступне речення';
    next.onclick = () => startSentenceSession();
    wrap.appendChild(next);
  }
  return wrap;
}

// ---------- Chat ----------
function renderChat(){
  const wrap = document.createElement('div');
  if (!state.chatMessages.length){
    const empty = document.createElement('div');
    empty.className = 'chat-empty';
    empty.textContent = 'Постав будь-яке питання про англійську мову — граматику, слова, вживання. Наприклад: "Яка різниця між Present Perfect і Past Simple?"';
    wrap.appendChild(empty);
    return wrap;
  }
  const list = document.createElement('div');
  list.className = 'chat-list';
  state.chatMessages.forEach(m => {
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (m.role === 'user' ? 'user' : 'assistant');
    bubble.textContent = m.content;
    list.appendChild(bubble);
  });
  if (state.chatLoading){
    const bubble = document.createElement('div');
    bubble.className = 'bubble assistant';
    bubble.textContent = 'Друкує...';
    list.appendChild(bubble);
  }
  wrap.appendChild(list);
  return wrap;
}

function renderChatInputBar(){
  const bar = document.createElement('div');
  bar.className = 'chat-input-bar';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Напиши питання...';
  input.value = state.chatInput;
  input.oninput = e => { state.chatInput = e.target.value; };
  input.onkeydown = e => { if (e.key === 'Enter') sendChatMessage(); };
  const send = document.createElement('button');
  send.className = 'chat-send-btn';
  send.textContent = '➤';
  send.disabled = state.chatLoading;
  send.onclick = sendChatMessage;
  bar.appendChild(input);
  bar.appendChild(send);
  return bar;
}

async function sendChatMessage(){
  const text = state.chatInput.trim();
  if (!text || state.chatLoading) return;
  state.chatMessages.push({ role:'user', content:text });
  state.chatInput = '';
  state.chatLoading = true;
  render();
  const system = "Ти — дружній репетитор англійської мови для україномовного студента рівня A2, який спілкується українською мовою. Пояснюй граматику, виправляй помилки, наводь приклади речень. Відповідай природно й розмовно, як у звичайній розмові, без зайвого форматування.";
  try{
    const reply = await askClaudeConversation(state.chatMessages, system);
    state.chatMessages.push({ role:'assistant', content: reply || 'Вибач, не вдалось отримати відповідь.' });
  }catch(e){
    state.chatMessages.push({ role:'assistant', content:'Сталася помилка запиту. Спробуй ще раз.' });
  }
  state.chatLoading = false;
  await storeSet('chatMessages', state.chatMessages);
  render();
}

// ---------- Bottom nav ----------
function renderBottomNav(){
  const nav = document.createElement('div');
  nav.className = 'bottom-nav';
  const items = [
    { key:'home', icon:'🗂', label:'Практика' },
    { key:'add', icon:'✏️', label:'Слова' },
    { key:'chat', icon:'💬', label:'Питання' },
    { key:'progress', icon:'📈', label:'Прогрес' },
  ];
  items.forEach(it => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (state.route === it.key ? ' active' : '');
    btn.innerHTML = `<span class="nav-icon">${it.icon}</span><span>${it.label}</span>`;
    btn.onclick = () => goto(it.key);
    nav.appendChild(btn);
  });
  return nav;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
