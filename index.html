        { h:'take', list:['take off — зняти (одяг) / злетіти; take after — бути схожим на (родича); take up — почати займатися; take out — виводити/виймати; take over — перебрати контроль.'] },
        { h:'put', list:['put on — одягнути; put off — відкласти; put up with — миритися з; put out — загасити; put away — прибрати.'] },
        { h:'Приклади', ex:[['I get up at seven.','Я встаю о сьомій.'],['The plane took off late.','Літак злетів із запізненням.'],['Don\'t put off your homework.','Не відкладай домашку.'],['I can\'t put up with this noise.','Я не можу миритися з цим шумом.']] },
      ]},
    { id:'phr-look', title:'look, turn, go, come', sub:'Рух, пошук, зміни',
      focus:'фразові дієслова з look, turn, go, come, give: look for, look after, look up, turn on, turn off, go on, come back, give up',
      blocks:[
        { h:'look', list:['look for — шукати; look after — доглядати; look up — знайти (у словнику); look forward to — з нетерпінням чекати (+ -ing); look out — стережись.'] },
        { h:'turn / give', list:['turn on / off — вмикати / вимикати; turn up / down — збільшити / зменшити гучність; give up — здатися; give back — повернути.'] },
        { h:'go / come', list:['go on — продовжувати; go out — виходити (з друзями); come back — повертатися; come across — випадково натрапити; come up with — придумати.'] },
        { h:'Приклади', ex:[['I\'m looking forward to seeing you.','Я з нетерпінням чекаю нашої зустрічі.'],['Please turn off your phone.','Вимкни, будь ласка, телефон.'],['She came up with a great idea.','Вона придумала чудову ідею.'],['Look up the word in a dictionary.','Знайди слово в словнику.']] },
        { h:'Зверни увагу', list:['look forward to — це to-прийменник, тому далі -ing: look forward to meeting.'] },
      ]},
  ],
};

function findLesson(id){
  for (const k of Object.keys(GRAMMAR_LESSONS)){
    const l = GRAMMAR_LESSONS[k].find(x => x.id === id);
    if (l) return { lesson:l, topic:k };
  }
  return null;
}

function renderLesson(){
  const wrap = document.createElement('div');
  const found = findLesson(state.lessonId);
  if (!found){ wrap.textContent = 'Урок не знайдено.'; return wrap; }
  const l = found.lesson;

  if (l.sub){
    const sub = document.createElement('p');
    sub.className = 'subtitle';
    sub.textContent = l.sub;
    wrap.appendChild(sub);
  }
  const topBtn = document.createElement('button');
  topBtn.className = 'primary-btn';
  topBtn.textContent = '🧩 Тренувати';
  topBtn.style.marginBottom = '12px';
  topBtn.onclick = () => startTrainer(l.title, l.focus, 'lesson');
  wrap.appendChild(topBtn);

  l.blocks.forEach(b => {
    const h = document.createElement('div');
    h.className = 'lesson-h';
    h.textContent = b.h;
    wrap.appendChild(h);
    if (b.p){
      const p = document.createElement('div');
      p.className = 'lesson-p';
      p.textContent = b.p;
      wrap.appendChild(p);
    }
    if (b.list){
      const ul = document.createElement('ul');
      ul.className = 'lesson-list';
      b.list.forEach(t => { const li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
      wrap.appendChild(ul);
    }
    if (b.ex){
      b.ex.forEach(e => {
        const row = document.createElement('div');
        row.className = 'lesson-ex';
        row.innerHTML = `<div class="en">${escapeHtml(e[0])}</div><div class="ua">${escapeHtml(e[1])}</div>`;
        const sp = document.createElement('button');
        sp.className = 'lesson-speak';
        sp.textContent = '🔊';
        sp.onclick = () => speakText(e[0]);
        row.appendChild(sp);
        wrap.appendChild(row);
      });
    }
  });

  const bottom = document.createElement('button');
  bottom.className = 'primary-btn';
  bottom.style.marginTop = '20px';
  bottom.textContent = '🧩 Тренувати це правило';
  bottom.onclick = () => startTrainer(l.title, l.focus, 'lesson');
  wrap.appendChild(bottom);
  return wrap;
}

// ---------- Duolingo-style trainer (Claude generates 5 new sentences) ----------
const TRAINER_BATCH = 5;

function trNorm(s){
  return String(s || '').toLowerCase().replace(/[’‘`]/g, "'").replace(/[^a-z0-9'\s-]/g, ' ').replace(/\s+/g, ' ').trim();
}
function startTrainer(title, focus, back){
  state.trainerBack = back;
  state.trainerTitle = title;
  state.trainerFocus = focus;
  goto('lesson-train');
  loadTrainerBatch();
}

async function loadTrainerBatch(){
  state.trainerState = { loading:true, items:[], index:0, score:0, error:null };
  render();
  let recentAll = {};
  try{ recentAll = (await storeGet('trainerRecent')) || {}; }catch(e){}
  const key = state.trainerTitle;
  const recent = recentAll[key] || [];
  const level = state.level || 'A2';
  const system = "Ти — викладач англійської для україномовного студента. Ти складаєш вправи у стилі Duolingo: переклад з української на англійську складанням речення зі слів.";
  const prompt = `Тема: ${state.trainerTitle}.\nФокус правила: ${state.trainerFocus}.\nРівень студента: ${level} (речення можуть бути на рівні ${level}, дещо складніші — не більше ніж на рівень вище).\n\nСклади ${TRAINER_BATCH} НОВИХ різних речень, кожне має чітко ілюструвати саме цю тему. Англійське речення: 4–10 слів, природне, без рідкісної лексики. Різні підмети й дієслова. Якщо тема це дозволяє — мікс стверджувальних, заперечних і питальних.\n${recent.length ? 'НЕ повторюй і не перефразовуй ці вже використані речення: ' + recent.slice(-40).join(' | ') + '\n' : ''}\nДля кожного речення дай:\n- "ukrainian": українське речення для перекладу (природне);\n- "english": правильний переклад;\n- "alternatives": масив із 0–2 інших ПОВНІСТЮ правильних англійських варіантів тієї ж граматики (інший порядок слів чи скорочення), якщо вони є;\n- "distractors": масив із 2 зайвих англійських слів, які виглядають правдоподібно, але не підходять (не слова з речення);\n- "explanation": 1–2 короткі речення українською: яке правило тут працює й чому саме така форма.\n\nПоверни ЛИШЕ JSON-масив із ${TRAINER_BATCH} об'єктів, без пояснень і без markdown.`;
  try{
    const raw = await askClaude(prompt, system, 2500, "claude-sonnet-4-6");
    const arr = parseJSONLoose(raw).slice(0, TRAINER_BATCH);
    const items = arr.map(o => {
      const english = String(o.english || '').trim().replace(/\s+/g, ' ');
      const words = english.split(' ');
      const tokens = words.map((text, id) => ({ id, text }));
      const dis = (o.distractors || []).slice(0, 2).filter(d => d && !words.some(w => trNorm(w) === trNorm(d)))
        .map((text, i) => ({ id: words.length + i, text: String(text).toLowerCase() }));
      const all = [...tokens, ...dis];
      const orderKey = tokens.map(t => t.id).join();
      let bank = gameShuffle(all);
      for (let k = 0; k < 6 && bank.filter(t => t.id < words.length).map(t => t.id).join() === orderKey; k++) bank = gameShuffle(all);
      const accepted = [english, ...(o.alternatives || [])].map(trNorm);
      return { ua:o.ukrainian, english, tokens: all, bank, line:[], accepted, explanation:o.explanation || '', checked:null };
    }).filter(it => it.english && it.ua);
    if (!items.length) throw new Error('empty');
    recentAll[key] = [...recent, ...items.map(i => i.english)].slice(-60);
    try{ await storeSet('trainerRecent', recentAll); }catch(e){}
    state.trainerState = { loading:false, items, index:0, score:0, error:null };
  }catch(e){
    state.trainerState = { loading:false, items:[], index:0, score:0, error:'Не вдалось створити речення. Перевір з\'єднання й спробуй ще раз.' };
  }
  render();
}

function trCheck(){
  const ts = state.trainerState;
  const it = ts.items[ts.index];
  if (it.checked || !it.line.length) return;
  const answer = trNorm(it.line.map(id => it.tokens.find(t => t.id === id).text).join(' '));
  const ok = it.accepted.includes(answer);
  it.checked = { ok };
  if (ok) ts.score++;
  logEvent('grammar', ok, state.trainerTitle);
  render();
}

function renderTrainer(){
  const wrap = document.createElement('div');
  const ts = state.trainerState;
  if (!ts || ts.loading){
    const l = document.createElement('div');
    l.className = 'done-msg';
    l.textContent = 'Складаю нові речення…';
    wrap.appendChild(l);
    return wrap;
  }
  if (ts.error){
    const e = document.createElement('div');
    e.className = 'feedback-box incorrect';
    e.textContent = ts.error;
    wrap.appendChild(e);
    const retry = document.createElement('button');
    retry.className = 'primary-btn';
    retry.style.marginTop = '12px';
    retry.textContent = 'Спробувати ще раз';
    retry.onclick = () => loadTrainerBatch();
    wrap.appendChild(retry);
    return wrap;
  }
  if (ts.index >= ts.items.length){
    const done = document.createElement('div');
    done.className = 'done-msg';
    done.textContent = `Правильно: ${ts.score} з ${ts.items.length} 🎉`;
    wrap.appendChild(done);
    const more = document.createElement('button');
    more.className = 'primary-btn';
    more.textContent = 'Ще 5 нових речень';
    more.onclick = () => loadTrainerBatch();
    wrap.appendChild(more);
    const back = document.createElement('button');
    back.className = 'secondary-btn';
    back.textContent = 'Назад до уроку';
    back.onclick = () => goto(state.trainerBack || 'reference');
    wrap.appendChild(back);
    return wrap;
  }

  const it = ts.items[ts.index];
  const progress = document.createElement('div');
  progress.className = 'progress-line';
  progress.textContent = `${ts.index + 1} / ${ts.items.length} · ${state.trainerTitle}`;
  wrap.appendChild(progress);

  const box = document.createElement('div');
  box.className = 'prompt-box';
  box.style.margin = '0 0 14px';
  box.innerHTML = `<div style="color:var(--slate);font-size:13px;margin-bottom:6px;">Переклади англійською</div><div class="ukr">${escapeHtml(it.ua)}</div>`;
  wrap.appendChild(box);

  const line = document.createElement('div');
  line.className = 'sb-line';
  it.line.forEach(id => {
    const t = it.tokens.find(x => x.id === id);
    const b = document.createElement('button');
    b.className = 'sb-tok in-line';
    b.textContent = t.text;
    b.disabled = !!it.checked;
    b.onclick = () => { it.line = it.line.filter(x => x !== id); render(); };
    line.appendChild(b);
  });
  wrap.appendChild(line);

  const bank = document.createElement('div');
  bank.className = 'sb-bank';
  it.bank.filter(t => !it.line.includes(t.id)).forEach(t => {
    const b = document.createElement('button');
    b.className = 'sb-tok';
    b.textContent = t.text;
    b.disabled = !!it.checked;
    b.onclick = () => { it.line.push(t.id); render(); };
    bank.appendChild(b);
  });
  wrap.appendChild(bank);

  if (!it.checked){
    const check = document.createElement('button');
    check.className = 'primary-btn';
    check.textContent = 'Перевірити';
    check.disabled = !it.line.length;
    check.onclick = trCheck;
    wrap.appendChild(check);
    if (it.line.length){
      const reset = document.createElement('button');
      reset.className = 'secondary-btn';
      reset.textContent = 'Почати спочатку';
      reset.onclick = () => { it.line = []; render(); };
      wrap.appendChild(reset);
    }
  } else {
    const fb = document.createElement('div');
    fb.className = 'feedback-box ' + (it.checked.ok ? 'correct' : 'incorrect');
    fb.innerHTML = `<div><strong>${it.checked.ok ? 'Правильно!' : 'Правильна відповідь:'}</strong> ${it.checked.ok ? '' : escapeHtml(it.english)}</div>` + (it.checked.ok ? `<div style="margin-top:4px;font-style:italic;">${escapeHtml(it.english)}</div>` : '') + (it.explanation ? `<div style="margin-top:8px;">${escapeHtml(it.explanation)}</div>` : '');
    wrap.appendChild(fb);
    const row = document.createElement('div');
    row.style.display = 'flex';
    row.style.gap = '10px';
    const sp = document.createElement('button');
    sp.className = 'secondary-btn';
    sp.textContent = '🔊';
    sp.style.width = '64px';
    sp.onclick = () => speakText(it.english);
    const next = document.createElement('button');
    next.className = 'primary-btn';
    next.style.marginTop = '10px';
    next.textContent = ts.index === ts.items.length - 1 ? 'Результат' : 'Далі';
    next.onclick = () => { ts.index++; render(); };
    row.appendChild(sp);
    row.appendChild(next);
    wrap.appendChild(row);
  }
  return wrap;
}

// ---------- Bottom nav ----------
function renderBottomNav(){
  const nav = document.createElement('div');
  nav.className = 'bottom-nav';
  const items = [
    { key:'home', icon:'🗂', label:'Практика' },
    { key:'add', icon:'✏️', label:'Слова' },
    { key:'games', icon:'🎮', label:'Ігри' },
    { key:'chat', icon:'💬', label:'Питання' },
    { key:'reference', icon:'📚', label:'Довідник' },
    { key:'progress', icon:'📈', label:'Прогрес' },
  ];
  items.forEach(it => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (state.route === it.key ? ' active' : '');
    btn.innerHTML = `<span class="nav-icon">${it.icon}</span><span>${it.label}</span>`;
    btn.onclick = () => goto(it.key);
    nav.appendChild(btn);
  });
  return nav;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
