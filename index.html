<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Зошит — вивчення слів</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#1B2430;
    --ink-2:#232E3C;
    --paper:#F6F0E4;
    --paper-2:#ECE3CF;
    --cream-text:#EDE6D6;
    --dark-text:#2A2118;
    --sage:#4C7A5E;
    --sage-dark:#3B5F49;
    --rust:#C4622D;
    --slate:#96A0B0;
    --line: rgba(237,230,214,0.14);
    --radius-card: 10px;
    --radius-ui: 6px;
  }
  body[data-theme="light"]{
    --ink:#EDEAE2;
    --ink-2:#E2DDCE;
    --cream-text:#2A2118;
    --slate:#7C7362;
    --line: rgba(42,33,24,0.14);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--ink);
    color:var(--cream-text);
    font-family:'IBM Plex Sans', sans-serif;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    padding:22px 20px 14px;
  }
  .topbar-left{ display:flex; align-items:center; gap:10px; }
  .theme-toggle{
    background:none;
    border:1px solid var(--line);
    color:var(--cream-text);
    border-radius:20px;
    padding:6px 11px;
    font-size:14px;
    cursor:pointer;
    flex-shrink:0;
  }
  .topbar h1{
    font-family:'IBM Plex Serif', serif;
    font-weight:600;
    font-size:22px;
    margin:0;
    letter-spacing:0.2px;
  }
  .back-btn{
    background:none;
    border:none;
    color:var(--cream-text);
    font-size:20px;
    cursor:pointer;
    padding:4px 8px 4px 0;
    line-height:1;
    opacity:0.85;
  }
  .subtitle{
    color:var(--slate);
    font-size:13px;
    margin:2px 0 0;
  }
  main{
    flex:1;
    padding:4px 20px 100px;
    overflow-y:auto;
  }
  .pack-item{
    background:var(--paper);
    color:var(--dark-text);
    border-radius:var(--radius-card);
    padding:16px 18px;
    margin-bottom:12px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 0 rgba(0,0,0,0.18);
  }
  .pack-item .name{
    font-family:'IBM Plex Serif', serif;
    font-weight:600;
    font-size:17px;
  }
  .pack-item .meta{
    color:#6b6152;
    font-size:12.5px;
    margin-top:3px;
  }
  .pack-item .due-badge{
    background:var(--sage);
    color:var(--cream-text);
    font-size:12px;
    font-weight:500;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .empty-state{
    color:var(--slate);
    font-size:14px;
    line-height:1.6;
    padding:40px 4px;
    text-align:left;
  }
  .primary-btn{
    width:100%;
    background:var(--sage);
    color:var(--cream-text);
    border:none;
    border-radius:var(--radius-ui);
    padding:15px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    margin-top:8px;
  }
  .primary-btn:active{ background:var(--sage-dark); }
  .primary-btn:disabled{ opacity:0.45; cursor:default; }
  .secondary-btn{
    width:100%;
    background:transparent;
    color:var(--cream-text);
    border:1px solid var(--line);
    border-radius:var(--radius-ui);
    padding:14px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    cursor:pointer;
    margin-top:10px;
  }
  textarea, input[type=text]{
    width:100%;
    background:var(--paper);
    color:var(--dark-text);
    border:none;
    border-radius:var(--radius-ui);
    padding:14px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    resize:vertical;
  }
  textarea{ min-height:140px; }
  label.field-label{
    display:block;
    font-size:13px;
    color:var(--slate);
    margin:18px 0 8px;
  }
  .tense-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:6px;
  }
  .chip{
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    font-size:13.5px;
    color:var(--cream-text);
    cursor:pointer;
    user-select:none;
  }
  .chip.active{
    background:var(--sage);
    border-color:var(--sage);
  }
  .mode-list{ display:flex; flex-direction:column; gap:12px; margin-top:10px; }
  .mode-item{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:18px;
    cursor:pointer;
  }
  .mode-item .title{ font-family:'IBM Plex Serif', serif; font-size:16px; font-weight:600; }
  .mode-item .desc{ color:var(--slate); font-size:13px; margin-top:4px; }

  /* Flashcard screen */
  .card-stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:20px;
  }
  .progress-line{ color:var(--slate); font-size:13px; margin-bottom:22px; }
  .flashcard{
    width:100%;
    max-width:320px;
    height:210px;
    background:var(--paper);
    color:var(--dark-text);
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    box-shadow:0 6px 0 rgba(0,0,0,0.22);
    cursor:pointer;
    position:relative;
    touch-action:pan-y;
    user-select:none;
    will-change:transform;
  }
  .flashcard .word{
    font-family:'IBM Plex Serif', serif;
    font-size:28px;
    font-weight:700;
  }
  .word-wrap{ display:flex; flex-direction:column; align-items:center; }
  .transcription{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12.5px;
    color:#6b6152;
    opacity:0.6;
    margin-top:4px;
  }
  .speak-btn{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(42,33,24,0.08);
    border:none;
    border-radius:50%;
    width:34px;
    height:34px;
    font-size:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--dark-text);
  }
  .flashcard .translation{
    font-family:'IBM Plex Serif', serif;
    font-size:22px;
    font-weight:600;
  }
  .flashcard .example{
    font-size:14px;
    color:#6b6152;
    margin-top:10px;
    font-style:italic;
  }
  .flip-hint{ color:var(--slate); font-size:12.5px; margin-top:16px; }
  .direction-toggle{
    background:none;
    border:1px solid var(--line);
    color:var(--cream-text);
    border-radius:20px;
    padding:6px 14px;
    font-size:13px;
    cursor:pointer;
    margin-bottom:16px;
  }
  .swipe-label{
    position:absolute;
    top:14px;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:13px;
    padding:5px 12px;
    border-radius:20px;
    border:2px solid currentColor;
    opacity:0;
    pointer-events:none;
  }
  .swipe-label.know{ right:14px; color:var(--sage); transform:rotate(8deg); }
  .swipe-label.forgot{ left:14px; color:var(--rust); transform:rotate(-8deg); }
  .grade-row{ display:flex; gap:12px; width:100%; max-width:320px; margin-top:24px; }
  .grade-btn{
    flex:1;
    border:none;
    border-radius:var(--radius-ui);
    padding:14px 8px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
  }
  .grade-hard{ background:rgba(196,98,45,0.22); color:#E9A57C; }
  .grade-easy{ background:rgba(76,122,94,0.3); color:#9CC7AC; }
  .done-msg{ text-align:center; color:var(--slate); padding:60px 10px; font-size:14.5px; line-height:1.7; }

  /* Match */
  .match-cols{ display:flex; gap:10px; margin-top:10px; }
  .match-col{ flex:1; display:flex; flex-direction:column; gap:8px; }
  .match-tile{
    background:var(--paper);
    color:var(--dark-text);
    border-radius:var(--radius-ui);
    padding:12px 10px;
    font-size:14px;
    text-align:center;
    cursor:pointer;
    border:2px solid transparent;
  }
  .match-tile.selected{ border-color:var(--rust); }
  .match-tile.matched{ background:var(--sage); color:var(--cream-text); opacity:0.55; cursor:default; }
  .match-tile.wrong{ border-color:#c0392b; }

  /* Sentence exercise */
  .prompt-box{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:18px;
    margin:16px 0 20px;
  }
  .prompt-box .ukr{
    font-family:'IBM Plex Serif', serif;
    font-size:19px;
    line-height:1.5;
  }
  .feedback-box{
    border-radius:var(--radius-card);
    padding:16px;
    margin-top:16px;
    font-size:14px;
    line-height:1.6;
  }
  .feedback-box.correct{ background:rgba(76,122,94,0.25); }
  .feedback-box.incorrect{ background:rgba(196,98,45,0.2); }
  .loading{ color:var(--slate); font-size:14px; text-align:center; padding:30px 0; }

  /* Bottom nav */
  .bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:460px;
    display:flex;
    background:var(--ink-2);
    border-top:1px solid var(--line);
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    flex:1;
    background:none;
    border:none;
    color:var(--slate);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12.5px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    cursor:pointer;
    padding:4px 0;
  }
  .nav-btn.active{ color:var(--cream-text); }
  .nav-icon{ font-size:19px; }
  .stat-row{
    display:flex;
    justify-content:space-between;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:16px 18px;
    margin-bottom:12px;
  }
  .stat-num{ font-family:'IBM Plex Serif', serif; font-size:24px; font-weight:700; }
  .stat-label{ color:var(--slate); font-size:12.5px; margin-top:2px; }

  .option-btn{
    width:100%;
    text-align:left;
    background:var(--paper);
    color:var(--dark-text);
    border:2px solid transparent;
    border-radius:var(--radius-ui);
    padding:14px 16px;
    font-size:15px;
    margin-bottom:10px;
    cursor:pointer;
  }
  .option-btn.correct{ border-color:var(--sage); }
  .option-btn.wrong{ border-color:var(--rust); }
  .option-btn:disabled{ opacity:0.9; cursor:default; }

  .word-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius-ui);
    padding:12px 14px;
    margin-bottom:8px;
  }
  .word-row .w{ font-weight:500; }
  .word-row .t{ color:var(--slate); font-size:13px; margin-top:2px; }
  .del-x{
    background:none;
    border:none;
    color:var(--rust);
    font-size:20px;
    cursor:pointer;
    padding:2px 8px;
    flex-shrink:0;
  }
  .danger-btn{
    width:100%;
    background:transparent;
    color:var(--rust);
    border:1px solid rgba(196,98,45,0.4);
    border-radius:var(--radius-ui);
    padding:14px;
    font-size:14.5px;
    cursor:pointer;
    margin-top:24px;
  }
  .replay-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--cream-text);
    border-radius:20px;
    padding:10px 18px;
    font-size:14px;
    cursor:pointer;
    margin-bottom:18px;
  }
  .account-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:14px 16px;
    margin-bottom:16px;
  }
  .account-row .email{ font-size:13.5px; color:var(--cream-text); }
  .google-btn{
    width:100%;
    background:var(--paper);
    color:var(--dark-text);
    border:none;
    border-radius:var(--radius-ui);
    padding:14px;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    margin-bottom:16px;
  }
  .signout-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--rust);
    border-radius:20px;
    padding:6px 14px;
    font-size:13px;
    cursor:pointer;
  }
  .chat-list{ display:flex; flex-direction:column; gap:10px; }
  .bubble{
    max-width:82%;
    padding:12px 14px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.55;
    white-space:pre-wrap;
  }
  .bubble.user{
    align-self:flex-end;
    background:var(--sage);
    color:var(--cream-text);
    border-bottom-right-radius:4px;
  }
  .bubble.assistant{
    align-self:flex-start;
    background:var(--paper);
    color:var(--dark-text);
    border-bottom-left-radius:4px;
  }
  .chat-empty{ color:var(--slate); font-size:14px; padding:30px 4px; line-height:1.6; }
  .chat-input-bar{
    position:fixed;
    bottom:70px;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:460px;
    background:var(--ink);
    border-top:1px solid var(--line);
    padding:10px 20px;
    display:flex;
    gap:8px;
  }
  .chat-input-bar input{ flex:1; }
  .chat-send-btn{
    background:var(--sage);
    color:var(--cream-text);
    border:none;
    border-radius:var(--radius-ui);
    padding:0 18px;
    font-size:14px;
    cursor:pointer;
  }
  .pack-mode-toggle{ display:flex; gap:8px; margin-bottom:14px; }
  .pack-mode-toggle .chip{ flex:1; text-align:center; }
  select.pack-select{
    width:100%;
    background:var(--paper);
    color:var(--dark-text);
    border:none;
    border-radius:var(--radius-ui);
    padding:14px;
    font-size:15px;
  }
  .ref-row{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius-ui);
    padding:14px 16px;
    margin-bottom:8px;
  }
  .ref-row .head{ display:flex; justify-content:space-between; font-weight:600; font-family:'IBM Plex Serif',serif; font-size:15.5px; }
  .ref-row .meta{ color:var(--slate); font-size:13px; margin-top:4px; }
  .ref-row .ex{ color:var(--slate); font-size:13px; margin-top:4px; font-style:italic; }
  .range-row{ display:flex; align-items:center; gap:10px; margin:6px 0 4px; }
  .range-row input[type=range]{ flex:1; }
  .range-value{ font-family:'IBM Plex Serif',serif; font-weight:600; min-width:64px; text-align:right; }
  .search-input{
    width:100%;
    background:var(--paper);
    color:var(--dark-text);
    border:none;
    border-radius:var(--radius-ui);
    padding:13px 14px;
    font-size:15px;
    margin-bottom:12px;
  }
</style>
</head>

function uid(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }

async function storeGet(key){
  try{
    if (state.user && db){
      const doc = await db.collection('users').doc(state.user.uid).collection('data').doc(key).get();
      return doc.exists ? doc.data().value : null;
    }
    if (window.storage && typeof window.storage.get === 'function'){
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : null;
    }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function storeSet(key, value){
  try{
    if (state.user && db){
      await db.collection('users').doc(state.user.uid).collection('data').doc(key).set({ value });
      return;
    }
    if (window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(key, JSON.stringify(value), false);
    } else {
      localStorage.setItem(key, JSON.stringify(value));
    }
  }catch(e){ console.error('storage error', e); }
}

async function loadAllData(){
  const packs = await storeGet('packs');
  const tenses = await storeGet('coveredTenses');
  const theme = await storeGet('theme');
  const chat = await storeGet('chatMessages');
  const level = await storeGet('level');
  const activityLog = await storeGet('activityLog');
  const verbProgress = await storeGet('verbProgress');
  const cardDirection = await storeGet('cardDirection');
  state.packs = (packs && packs.length) ? packs : (state.user ? [] : [seedDemoPack()]);
  if ((!packs || !packs.length) && !state.user) await storeSet('packs', state.packs);
  state.coveredTenses = tenses || ["Present Simple","Present Perfect"];
  state.theme = theme || 'dark';
  state.level = level || 'A2';
  state.chatMessages = chat || [];
  state.activityLog = activityLog || [];
  state.verbProgress = verbProgress || {};
  state.cardDirection = cardDirection || 'en';
  document.body.setAttribute('data-theme', state.theme);
}

async function init(){
  if (auth){
    auth.getRedirectResult().catch(e => {
      console.error('Redirect result error', e);
      window.__fbAuthError = (e && e.message) ? e.message : String(e);
    });
    auth.onAuthStateChanged(async (user) => {
      state.user = user;
      await loadAllData();
      render();
    });
  } else {
    await loadAllData();
    render();
  }
}

async function toggleTheme(){
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.body.setAttribute('data-theme', state.theme);
  await storeSet('theme', state.theme);
  render();
}

async function savePacks(){ await storeSet('packs', state.packs); }

      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('direct call unavailable');
    return await res.json();
  }catch(e){
    const res2 = await fetch("/api/claude", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    return await res2.json();
  }
}

async function askClaude(userPrompt, systemPrompt, maxTokens){
  const body = {
    model: "claude-haiku-4-5-20251001",
    max_tokens: maxTokens || 1000,
    messages: [{ role: "user", content: userPrompt }]
  };
  if (systemPrompt) body.system = systemPrompt;
  const data = await callClaudeAPI(body);
  const block = (data.content || []).find(b => b.type === "text");
  return block ? block.text : "";
}

async function askClaudeConversation(messages, systemPrompt){
  const body = {
    model: "claude-haiku-4-5-20251001",
    max_tokens: 1000,
    messages: messages.map(m => ({ role: m.role, content: m.content }))
  };
  if (systemPrompt) body.system = systemPrompt;
  const data = await callClaudeAPI(body);
  const block = (data.content || []).find(b => b.type === "text");
  return block ? block.text : "";
}

function parseJSONLoose(text){
  const cleaned = text.replace(/```json/g,'').replace(/```/g,'').trim();
  return JSON.parse(cleaned);
}

function goto(route, extra){
  state.route = route;
  Object.assign(state, extra || {});

}

// ---------- Card generation ----------
async function generateCards(packNameOrTargetId, rawText, appendToExisting){
  const system = "Ти генеруєш навчальні картки англійської мови для україномовного користувача рівня A2-B1. Завжди повертай ЛИШЕ валідний JSON, без пояснень і без markdown-огорожі.";
  const prompt = `Ось текст або список слів для вивчення:\n\n${rawText}\n\nСтвори JSON-масив об'єктів формату {"word":"...", "translation":"...", "example":"...", "transcription":"..."} для ВСІХ значущих слів чи фраз звідси (пропускай артиклі, займенники, прийменники, якщо це суцільний текст). "transcription" — якщо у вихідному тексті вже є транскрипція (IPA чи вимова кирилицею) — візьми її; якщо немає — згенеруй стандартну IPA-транскрипцію сам. "example" — просте речення англійською з цим словом. Обробляй увесь наданий текст, не обмежуй кількість об'єктів. Поверни лише масив.`;
  const raw = await askClaude(prompt, system, 4000);
  const items = parseJSONLoose(raw);
  const words = items.map(it => ({
    id: uid(),
    word: it.word,
    translation: it.translation,
    example: it.example || "",
    transcription: it.transcription || "",
    box: 1,
    dueAt: Date.now()
  }));
  if (appendToExisting){
    const pack = state.packs.find(p => p.id === packNameOrTargetId);
    pack.words.push(...words);
    await savePacks();
    return pack;
  }
  const pack = { id: uid(), name: packNameOrTargetId, words };
  state.packs.push(pack);
  await savePacks();
  return pack;
}

function speakText(text){
  if (!text || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  window.speechSynthesis.speak(utter);
}

function dueWords(pack){
  const now = Date.now();
  const shuffled = [...pack.words].sort(() => Math.random() - 0.5);
  const due = shuffled.filter(w => w.dueAt <= now).sort((a,b)=>a.box-b.box);
  return due.length ? due : shuffled.sort((a,b)=>a.box-b.box);
}

async function logEvent(kind, correct, meta){
  try{
    const log = state.activityLog || (state.activityLog = []);
    log.push({ ts: Date.now(), kind, correct: !!correct, meta: meta || '' });
    if (log.length > 400) log.splice(0, log.length - 400);
    await storeSet('activityLog', log);
  }catch(e){ /* logging is best-effort */ }
}

function gradeCard(pack, word, easy){
  if (easy){
    word.box = Math.min(5, word.box + 1);
  } else {
    word.box = 1;
  }
  word.dueAt = Date.now() + BOX_HOURS[word.box] * 3600 * 1000;
  logEvent('word', easy, pack ? pack.name : '');
}

function reinsertForRetry(word){
  const remaining = state.sessionQueue.length - (state.sessionIndex + 1);
  if (remaining <= 0){
    state.sessionQueue.push(word);
    return;
  }
  const offset = 1 + Math.floor(Math.random() * remaining);
  state.sessionQueue.splice(state.sessionIndex + offset, 0, word);
}

  const card = document.createElement('div');
  card.className = 'flashcard';
  card.innerHTML = state.flipped
    ? `<button class="speak-btn" aria-label="Прослухати">🔊</button><div><div class="translation">${escapeHtml(backText)}</div>${showTranscriptionBack ? `<div class="transcription">${escapeHtml(word.transcription)}</div>` : ''}<div class="example">${escapeHtml(word.example)}</div></div>`

  hint.textContent = state.flipped ? 'Тапни картку, щоб перевернути назад' : 'Свайпни вправо — знаю · вліво — забув · тапни, щоб перевернути';
  wrap.appendChild(hint);

function attachSwipeHandlers(card, pack, word){
  let startX = 0, dx = 0, dragging = false, moved = false;
  const knowLabel = card.querySelector('.swipe-label.know');
  const forgotLabel = card.querySelector('.swipe-label.forgot');
  const THRESHOLD = 90;

  card.onpointerdown = (e) => {
    dragging = true; moved = false; dx = 0;
    startX = e.clientX;
    card.style.transition = 'none';
    card.setPointerCapture(e.pointerId);
  };
  card.onpointermove = (e) => {
    if (!dragging) return;
    dx = e.clientX - startX;
    if (Math.abs(dx) > 5) moved = true;
    const rotate = dx / 18;
    card.style.transform = `translateX(${dx}px) rotate(${rotate}deg)`;
    const t = Math.min(Math.abs(dx) / THRESHOLD, 1);
    if (dx > 0){ knowLabel.style.opacity = t; forgotLabel.style.opacity = 0; }
    else if (dx < 0){ forgotLabel.style.opacity = t; knowLabel.style.opacity = 0; }
    else { knowLabel.style.opacity = 0; forgotLabel.style.opacity = 0; }
  };
  const finish = (e) => {
    if (!dragging) return;
    dragging = false;
    card.style.transition = 'transform 0.28s ease, opacity 0.28s ease';
    if (dx > THRESHOLD){
      card.style.transform = `translateX(700px) rotate(20deg)`;
      card.style.opacity = '0';
      gradeCard(pack, word, true);
      savePacks();
      setTimeout(nextCard, 220);
    } else if (dx < -THRESHOLD){
      card.style.transform = `translateX(-700px) rotate(-20deg)`;
      card.style.opacity = '0';
      gradeCard(pack, word, false);
      reinsertForRetry(word);
      savePacks();
      setTimeout(nextCard, 220);
    } else {
      card.style.transform = 'translateX(0) rotate(0)';
      knowLabel.style.opacity = 0;
      forgotLabel.style.opacity = 0;
      if (!moved){ state.flipped = true; render(); }
    }
    dx = 0;
  };
  card.onpointerup = finish;
  card.onpointercancel = finish;
}

function nextCard(){
  state.sessionIndex += 1;
  state.flipped = false;
  render();
}

// ---------- Match ----------
const MATCH_PAGE_SIZE = 10;

function startMatchSession(){
  const pack = currentPack();
  state.matchAllWords = [...pack.words].sort(() => Math.random() - 0.5);
  state.matchPageIndex = 0;
  loadMatchPage();
  goto('match');
}

function loadMatchPage(){
  const start = state.matchPageIndex * MATCH_PAGE_SIZE;
  const pageWords = state.matchAllWords.slice(start, start + MATCH_PAGE_SIZE);
  const left = pageWords.map(w => ({ id:w.id, text:w.word })).sort(() => Math.random() - 0.5);
  const right = pageWords.map(w => ({ id:w.id, text:w.translation })).sort(() => Math.random() - 0.5);
  state.matchState = { left, right, selectedLeft:null, selectedRight:null, matched:[], wrong:null };
}

function renderMatch(){
  const wrap = document.createElement('div');
  const ms = state.matchState;
  const total = state.matchAllWords.length;
  const pageStart = state.matchPageIndex * MATCH_PAGE_SIZE + 1;
  const pageEnd = Math.min((state.matchPageIndex + 1) * MATCH_PAGE_SIZE, total);
  const progress = document.createElement('div');
  progress.className = 'progress-line';
  progress.textContent = `${pageStart}–${pageEnd} з ${total}`;
  wrap.appendChild(progress);

  const cols = document.createElement('div');
  cols.className = 'match-cols';
  const colL = document.createElement('div'); colL.className = 'match-col';
  const colR = document.createElement('div'); colR.className = 'match-col';

  ms.left.forEach(item => {
    const tile = document.createElement('div');
    tile.className = 'match-tile';
    if (ms.matched.includes(item.id)) tile.classList.add('matched');
    if (ms.selectedLeft === item.id) tile.classList.add('selected');
    if (ms.wrong === item.id) tile.classList.add('wrong');
    tile.textContent = item.text;
    tile.onclick = () => { if (!ms.matched.includes(item.id)){ ms.selectedLeft = item.id; checkMatch(); render(); } };
    colL.appendChild(tile);
  });
  ms.right.forEach(item => {
    const tile = document.createElement('div');
    tile.className = 'match-tile';
    if (ms.matched.includes(item.id)) tile.classList.add('matched');
    if (ms.selectedRight === item.id) tile.classList.add('selected');
    tile.textContent = item.text;
    tile.onclick = () => { if (!ms.matched.includes(item.id)){ ms.selectedRight = item.id; checkMatch(); render(); } };
    colR.appendChild(tile);
  });
  cols.appendChild(colL); cols.appendChild(colR);
  wrap.appendChild(cols);

  if (ms.matched.length === ms.left.length){
    const hasMore = pageEnd < total;
    const done = document.createElement('div');
    done.className = 'done-msg';
    done.textContent = hasMore ? 'Ці 10 пройдено 🎉' : `Усі ${total} слів пройдено 🎉`;
    wrap.appendChild(done);
    const nextBtn = document.createElement('button');
    nextBtn.className = 'primary-btn';
    if (hasMore){
      nextBtn.textContent = 'Наступні 10 слів';
      nextBtn.onclick = () => { state.matchPageIndex++; loadMatchPage(); render(); };
    } else {
      nextBtn.textContent = 'Почати спочатку';
      nextBtn.onclick = () => startMatchSession();
    }
    wrap.appendChild(nextBtn);
  }
  return wrap;
}

function checkMatch(){
  const ms = state.matchState;
  if (ms.selectedLeft && ms.selectedRight){
    if (ms.selectedLeft === ms.selectedRight){
      ms.matched.push(ms.selectedLeft);
      ms.selectedLeft = null; ms.selectedRight = null; ms.wrong = null;
    } else {
      ms.wrong = ms.selectedLeft;
      const badLeft = ms.selectedLeft, badRight = ms.selectedRight;
      setTimeout(() => {
        ms.selectedLeft = null; ms.selectedRight = null; ms.wrong = null;
        render();
      }, 600);
    }
  }
}

function buildGapSentence(word){
  if (!word.example) return null;
  const re = new RegExp('\\b' + word.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\w*', 'i');
  if (!re.test(word.example)) return null;
  return word.example.replace(re, '____');
}

const SENTENCE_BATCH_SIZE = 10;

function startSentenceSession(){
  state.sentenceState = { loading:true, items:[], answers:[], currentIndex:0, checking:false, results:null };
  goto('sentence');
  loadSentenceBatch();
}

async function loadSentenceBatch(){
  const pack = currentPack();
  const tenses = state.coveredTenses.length ? state.coveredTenses : ["Present Simple"];
  const words = pack.words.map(w=>w.word);
  const level = state.level || 'A2';
  const harderLevel = nextLevelUp(level);
  const system = "Ти — викладач англійської для україномовного студента. Ти складаєш вправи на переклад речення з української на англійську.";
  const prompt = `Рівень студента: ${level}. Дозволені часові форми: ${tenses.join(", ")}.\nСлова з пакету: ${words.join(", ")}.\n\nСклади ${SENTENCE_BATCH_SIZE} РІЗНИХ речень українською мовою, переклад яких англійською вимагає однієї з дозволених часових форм. Постарайся використати слова зі списку (різні слова в різних реченнях, у потрібній формі). Приблизно 60-70% речень має відповідати рівню ${level}, а 30-40% — навмисно трохи складніші, рівня ${harderLevel} (складніша лексика чи структура), щоб студент прогресував швидше. Поверни ЛИШЕ JSON-масив з ${SENTENCE_BATCH_SIZE} об'єктів формату {"ukrainian":"...", "expected_tense":"...", "target_word":"...", "level":"A2 або B1 тощо"} без пояснень.`;
  try{
    const raw = await askClaude(prompt, system, 3000);
    const items = parseJSONLoose(raw);
    state.sentenceState = { loading:false, items, answers: items.map(()=>''), currentIndex:0, checking:false, results:null };
  }catch(e){
    state.sentenceState = { loading:false, items:[], answers:[], currentIndex:0, checking:false, results:'error' };
  }
  render();
}

async function checkSentenceBatch(){
  const ss = state.sentenceState;
  ss.checking = true;
  render();
  const system = "Ти перевіряєш переклади студента з української на англійську. Фокусуйся на граматичній правильності, правильній часовій формі та вживанні цільового слова кожного речення. Пояснюй доброзичливо і конкретно, з поясненням граматики там, де є помилка.";
  const payload = ss.items.map((it, i) => ({
    ukrainian: it.ukrainian,
    expected_tense: it.expected_tense,
    target_word: it.target_word,
    student_answer: ss.answers[i]
  }));
  const prompt = `Ось ${payload.length} речень з відповідями студента у форматі JSON:\n${JSON.stringify(payload)}\n\nПеревір КОЖНЕ речення окремо. Поверни ЛИШЕ JSON-масив з ${payload.length} об'єктів у ТОМУ Ж ПОРЯДКУ, формату {"correct": true/false, "feedback":"розмовне пояснення українською чому правильно чи неправильно", "corrected":"виправлений варіант, якщо є помилки, інакше порожній рядок"}.`;
  try{
    const raw = await askClaude(prompt, system, 3000);
    ss.results = parseJSONLoose(raw);
    ss.results.forEach((r, i) => logEvent('sentence', r.correct, (ss.items[i] && ss.items[i].expected_tense) || ''));
  }catch(e){
    ss.results = 'error';
  }
  ss.checking = false;
  render();

    wrap.appendChild(retry);

  progress.textContent = `${idx + 1} / ${ss.items.length}`;
  wrap.appendChild(progress);

  const box = document.createElement('div');
  box.className = 'prompt-box';
  box.innerHTML = `<div class="ukr">${escapeHtml(item.ukrainian)}</div>`;
  wrap.appendChild(box);

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Переклади англійською...';
  input.value = ss.answers[idx];
  input.oninput = (e) => { ss.answers[idx] = e.target.value; };
  wrap.appendChild(input);

  const btn = document.createElement('button');
  btn.className = 'primary-btn';
  const isLast = idx === ss.items.length - 1;
  btn.textContent = ss.checking ? 'Перевіряю всі...' : (isLast ? 'Перевірити всі 10' : 'Далі');
  btn.disabled = ss.checking;
  btn.onclick = () => {
    if (isLast){
      checkSentenceBatch();
    } else {
      ss.currentIndex++;
      render();
    }
  };
  wrap.appendChild(btn);
  return wrap;
}

  if (!state.chatMessages.length){
    const empty = document.createElement('div');
    empty.className = 'chat-empty';
    empty.textContent = 'Постав будь-яке питання про англійську мову — граматику, слова, вживання. Наприклад: "Яка різниця між Present Perfect і Past Simple?"';
    wrap.appendChild(empty);
    return wrap;
  }
  const list = document.createElement('div');
  list.className = 'chat-list';
  state.chatMessages.forEach(m => {
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (m.role === 'user' ? 'user' : 'assistant');
    bubble.textContent = m.content;
    list.appendChild(bubble);
  });
  if (state.chatLoading){
    const bubble = document.createElement('div');
    bubble.className = 'bubble assistant';
    bubble.textContent = 'Друкує...';
    list.appendChild(bubble);
  }
  wrap.appendChild(list);
  return wrap;
}

function renderChatInputBar(){
  const bar = document.createElement('div');
  bar.className = 'chat-input-bar';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Напиши питання...';
  input.value = state.chatInput;
  input.oninput = e => { state.chatInput = e.target.value; };
  input.onkeydown = e => { if (e.key === 'Enter') sendChatMessage(); };
  const send = document.createElement('button');
  send.className = 'chat-send-btn';
  send.textContent = '➤';
  send.disabled = state.chatLoading;
  send.onclick = sendChatMessage;
  bar.appendChild(input);
  bar.appendChild(send);
  return bar;
}

async function sendChatMessage(){
  const text = state.chatInput.trim();
  if (!text || state.chatLoading) return;
  state.chatMessages.push({ role:'user', content:text });
  state.chatInput = '';
  state.chatLoading = true;
  render();
  const system = "Ти — дружній репетитор англійської мови для україномовного студента рівня A2, який спілкується українською мовою. Пояснюй граматику, виправляй помилки, наводь приклади речень. Відповідай природно й розмовно, як у звичайній розмові, без зайвого форматування.";
  try{
    const reply = await askClaudeConversation(state.chatMessages, system);
    state.chatMessages.push({ role:'assistant', content: reply || 'Вибач, не вдалось отримати відповідь.' });
  }catch(e){
    state.chatMessages.push({ role:'assistant', content:'Сталася помилка запиту. Спробуй ще раз.' });
  }
  state.chatLoading = false;
  await storeSet('chatMessages', state.chatMessages);
  render();
}

// ---------- Reference tab ----------
function renderReference(){
  const wrap = document.createElement('div');
  const list = document.createElement('div');
  list.className = 'mode-list';
  const sections = [
    { key:'verbs', title:'Неправильні дієслова', desc:`${IRREGULAR_VERBS.length} дієслів за частотою вживання, з пошуком і тренуванням` },
    { key:'modals', title:'Модальні дієслова', desc:'can / could / must / should / may / might...' },
    { key:'articles', title:'Артиклі a / an / the', desc:'Коли який артикль вживати' },
    { key:'preps', title:'Прийменники часу і місця', desc:'at / on / in / to / into' },
    { key:'tenses', title:'12 часових форм', desc:'Формули і слова-сигнали одним екраном' },
    { key:'conditionals', title:'Умовні речення', desc:'Zero / First / Second / Third Conditional' },
    { key:'phrasals', title:'Фразові дієслова', desc:'Найуживаніші поєднання дієслово + прийменник' },
  ];
  sections.forEach(s => {
    const item = document.createElement('div');
    item.className = 'mode-item';
    item.innerHTML = `<div class="title">${s.title}</div><div class="desc">${s.desc}</div>`;
    item.onclick = () => goto(s.key);
    list.appendChild(item);
  });
  wrap.appendChild(list);
  return wrap;
}

function renderStaticList(topicKey){
  const section = REFERENCE_SECTIONS[topicKey];
  const wrap = document.createElement('div');
  const trainBtn = document.createElement('button');
  trainBtn.className = 'primary-btn';
  trainBtn.textContent = '🎯 Тренувати';
  trainBtn.style.marginBottom = '16px';
  trainBtn.onclick = () => startGrammarQuiz(topicKey, topicKey);
  wrap.appendChild(trainBtn);
  section.data.forEach(item => {
    const m = section.map(item);
    const row = document.createElement('div');
    row.className = 'ref-row';
    row.innerHTML = `<div class="head"><span>${escapeHtml(m.title)}</span></div><div class="meta">${escapeHtml(m.meta)}</div><div class="ex">${escapeHtml(m.ex)}</div>`;
    wrap.appendChild(row);
  });
  return wrap;
}

function startGrammarQuiz(topic, backRoute){
  const bank = (REFERENCE_SECTIONS[topic] && REFERENCE_SECTIONS[topic].quiz) || [];
  const shuffled = [...bank].sort(() => Math.random() - 0.5);
  state.grammarQuizState = { topic, questions: shuffled, index: 0, score: 0, answered: null };
  state.grammarQuizBack = backRoute;
  goto('grammarquiz');
}

function renderGrammarQuiz(){
  const wrap = document.createElement('div');
  const qs = state.grammarQuizState;
  if (!qs || !qs.questions.length){
    const e = document.createElement('div'); e.className='empty-state'; e.textContent='Немає питань для цього розділу.';
    wrap.appendChild(e);
    return wrap;
  }
  if (qs.index >= qs.questions.length){
    const done = document.createElement('div');
    done.className = 'done-msg';
    done.textContent = `Готово! Правильно: ${qs.score} / ${qs.questions.length}`;
    wrap.appendChild(done);
    const retry = document.createElement('button');
    retry.className = 'primary-btn';
    retry.textContent = 'Пройти ще раз';
    retry.onclick = () => startGrammarQuiz(qs.topic, state.grammarQuizBack);
    wrap.appendChild(retry);
    return wrap;
  }
  const q = qs.questions[qs.index];
  const progress = document.createElement('div');
  progress.className = 'progress-line';
  progress.textContent = `${qs.index + 1} / ${qs.questions.length}`;
  wrap.appendChild(progress);
  const box = document.createElement('div');
  box.className = 'prompt-box';
  box.innerHTML = `<div class="ukr" style="font-size:17px;">${escapeHtml(q.prompt)}</div>`;
  wrap.appendChild(box);
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    if (qs.answered){
      if (opt === q.correct) btn.classList.add('correct');
      else if (opt === qs.answered.chosen) btn.classList.add('wrong');
    }
    btn.disabled = !!qs.answered;
    btn.textContent = opt;
    btn.onclick = () => {
      const isCorrect = opt === q.correct;
      qs.answered = { chosen: opt };
      if (isCorrect) qs.score++;
      logEvent('grammar', isCorrect, qs.topic);
      render();
    };
    wrap.appendChild(btn);
  });
  if (qs.answered){
    const fb = document.createElement('div');
    fb.className = 'feedback-box ' + (qs.answered.chosen === q.correct ? 'correct' : 'incorrect');
    fb.textContent = q.explanation;
    wrap.appendChild(fb);
    const next = document.createElement('button');
    next.className = 'primary-btn';
    next.textContent = 'Далі';
    next.onclick = () => { qs.index++; qs.answered = null; render(); };
    wrap.appendChild(next);
  }
  return wrap;
}

// ---------- Irregular verbs ----------
function renderVerbsList(){
  const wrap = document.createElement('div');
  const search = document.createElement('input');
  search.type = 'text';
  search.className = 'search-input';
  search.placeholder = 'Пошук слова...';
  search.value = state.verbSearch || '';
  search.oninput = e => { state.verbSearch = e.target.value; render(); };
  wrap.appendChild(search);

  const rangeLabel = document.createElement('label');
  rangeLabel.className = 'field-label';
  rangeLabel.textContent = `Тренувати перші ${state.verbRangeTo || 50} дієслів зі списку`;
  wrap.appendChild(rangeLabel);
  const rangeRow = document.createElement('div');
  rangeRow.className = 'range-row';
  const range = document.createElement('input');
  range.type = 'range';
  range.min = 10;
  range.max = IRREGULAR_VERBS.length;
  range.step = 10;
  range.value = state.verbRangeTo || 50;
  range.oninput = e => { state.verbRangeTo = parseInt(e.target.value, 10); render(); };
  rangeRow.appendChild(range);
  wrap.appendChild(rangeRow);

  const trainBtn = document.createElement('button');
  trainBtn.className = 'primary-btn';
  trainBtn.textContent = `🎯 Тренувати (1–${state.verbRangeTo || 50})`;
  trainBtn.style.marginBottom = '16px';
  trainBtn.onclick = () => startVerbTrainSession(state.verbRangeTo || 50);
  wrap.appendChild(trainBtn);

  const q = (state.verbSearch || '').toLowerCase().trim();
  const filtered = q
    ? IRREGULAR_VERBS.filter(v => v.base.toLowerCase().includes(q) || v.translation.toLowerCase().includes(q) || v.past.toLowerCase().includes(q) || v.participle.toLowerCase().includes(q))
    : IRREGULAR_VERBS;

  filtered.forEach(v => {
    const row = document.createElement('div');
    row.className = 'ref-row';
    row.innerHTML = `<div class="head"><span>${v.rank}. ${escapeHtml(v.base)} — ${escapeHtml(v.past)} — ${escapeHtml(v.participle)}</span></div><div class="meta">${escapeHtml(v.translation)}</div>`;
    wrap.appendChild(row);
  });
  return wrap;
}

function dueVerbs(subsetIds){
  const now = Date.now();
  const prog = state.verbProgress || {};
  const shuffled = [...subsetIds].sort(() => Math.random() - 0.5);
  const withMeta = shuffled.map(id => ({ id, box: (prog[id] && prog[id].box) || 1, dueAt: (prog[id] && prog[id].dueAt) || 0 }));
  const due = withMeta.filter(w => w.dueAt <= now).sort((a,b) => a.box - b.box);
  const ordered = (due.length ? due : withMeta.sort((a,b) => a.box - b.box));
  return ordered.map(w => IRREGULAR_VERBS.find(v => v.id === w.id));
}

function gradeVerb(verbId, easy){
  const prog = state.verbProgress || {};
  const cur = prog[verbId] || { box:1, dueAt:0 };
  const box = easy ? Math.min(5, cur.box + 1) : 1;
  prog[verbId] = { box, dueAt: Date.now() + BOX_HOURS[box] * 3600 * 1000 };
  state.verbProgress = prog;
  storeSet('verbProgress', prog);
  logEvent('verb', easy, verbId);
}

function startVerbTrainSession(n){
  const subsetIds = IRREGULAR_VERBS.slice(0, n).map(v => v.id);
  state.verbTrainQueue = dueVerbs(subsetIds);
  state.verbTrainIndex = 0;
  state.verbTrainFlipped = false;
  goto('verbtrain');
}

function nextVerb(){
  state.verbTrainIndex++;
  state.verbTrainFlipped = false;
  render();
}

function renderVerbTrain(){
  const wrap = document.createElement('div');
  wrap.className = 'card-stage';
  if (state.verbTrainIndex >= state.verbTrainQueue.length){
    wrap.appendChild(doneMsg());
    return wrap;
  }
  const v = state.verbTrainQueue[state.verbTrainIndex];
  const progress = document.createElement('div');
  progress.className = 'progress-line';
  progress.textContent = `${state.verbTrainIndex + 1} / ${state.verbTrainQueue.length}`;
  wrap.appendChild(progress);

  const card = document.createElement('div');
  card.className = 'flashcard';
  card.innerHTML = state.verbTrainFlipped
    ? `<button class="speak-btn" aria-label="Прослухати">🔊</button><div><div class="word" style="font-size:20px;">${escapeHtml(v.base)}</div><div class="translation" style="font-size:17px;margin-top:6px;">${escapeHtml(v.past)}</div><div class="translation" style="font-size:17px;">${escapeHtml(v.participle)}</div></div>`
    : `<div class="word-wrap"><div class="word">${escapeHtml(v.translation)}</div></div>`;
  wrap.appendChild(card);

  if (state.verbTrainFlipped){
    const speakBtn = card.querySelector('.speak-btn');
    speakBtn.onpointerdown = (e) => e.stopPropagation();
    speakBtn.onclick = (e) => { e.stopPropagation(); speakText(v.base + ', ' + v.past + ', ' + v.participle); };
    card.onclick = () => { state.verbTrainFlipped = false; render(); };
  } else {
    card.onclick = () => { state.verbTrainFlipped = true; render(); };
  }

  const hint = document.createElement('div');
  hint.className = 'flip-hint';
  hint.textContent = state.verbTrainFlipped ? 'Тапни, щоб перевернути назад' : 'Тапни, щоб побачити 3 форми';
  wrap.appendChild(hint);

  if (state.verbTrainFlipped){
    const row = document.createElement('div');
    row.className = 'grade-row';
    const hard = document.createElement('button'); hard.className = 'grade-btn grade-hard'; hard.textContent = 'Складно';
    hard.onclick = () => { gradeVerb(v.id, false); nextVerb(); };
    const easy = document.createElement('button'); easy.className = 'grade-btn grade-easy'; easy.textContent = 'Легко';
    easy.onclick = () => { gradeVerb(v.id, true); nextVerb(); };
    row.appendChild(hard); row.appendChild(easy);
    wrap.appendChild(row);
  }
  return wrap;
}

// ---------- Personal progress analysis (on demand, one API call) ----------
function buildActivitySummary(){
  const now = Date.now();
  const week = 7 * 24 * 3600 * 1000;
  const log = state.activityLog || [];
  const last7 = log.filter(e => now - e.ts <= week);
  const prev7 = log.filter(e => now - e.ts > week && now - e.ts <= 2 * week);
  function stats(arr){
    const total = arr.length;
    const correct = arr.filter(e => e.correct).length;
    const byKind = {};
    arr.forEach(e => {
      byKind[e.kind] = byKind[e.kind] || { total:0, correct:0 };
      byKind[e.kind].total++;
      if (e.correct) byKind[e.kind].correct++;
    });
    return { total, correct, rate: total ? Math.round(correct/total*100) : null, byKind };
  }
  return { last7: stats(last7), prev7: stats(prev7), totalEver: log.length };
}

async function requestProgressAnalysis(){
  state.progressAnalysis = { loading:true, text:null };
  render();
  const summary = buildActivitySummary();
  if (summary.totalEver < 5){
    state.progressAnalysis = { loading:false, text:'Ще замало даних для аналізу — попрактикуйся трохи більше і повертайся сюди.' };
    render();
    return;
  }
  const system = "Ти — персональний супервізор з вивчення англійської мови. Аналізуєш статистику практики студента і даєш чесний, конкретний, підтримуючий висновок українською мовою: що покращилось порівняно з попереднім тижнем, де є проблеми, на що звернути увагу. Не вигадуй деталей, яких немає в даних. Пиши як людина в розмові, а не як формальний звіт зі списком.";
  const prompt = `Ось статистика практики студента у форматі JSON:\n${JSON.stringify(summary)}\n\nkind означає тип вправи: word (картки/слова), sentence (побудова речень), grammar (граматичні тести), verb (неправильні дієслова). rate — відсоток правильних відповідей. last7 — останні 7 днів, prev7 — тиждень до того. Дай короткий (3-5 речень) персональний аналіз прогресу.`;
  try{
    const text = await askClaude(prompt, system, 500);
    state.progressAnalysis = { loading:false, text };
  }catch(e){
    state.progressAnalysis = { loading:false, text:'Не вдалось отримати аналіз. Спробуй пізніше.' };
  }
  render();
}

function renderBottomNav(){
  const nav = document.createElement('div');
  nav.className = 'bottom-nav';
  const items = [
    { key:'home', icon:'🗂', label:'Практика' },
    { key:'add', icon:'✏️', label:'Слова' },
    { key:'chat', icon:'💬', label:'Питання' },

    const btn = document.createElement('button');

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
